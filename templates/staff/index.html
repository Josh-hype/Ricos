<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>{{shopShortName}} — orders</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="{{shopShortName}} orders" />
<meta name="theme-color" content="#181210" />
<link rel="manifest" href="/staff/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --red: {{themePrimary}};
    --red-dark: {{themePrimaryDark}};
    --yellow: {{themeAccent}};
    --cream: {{themeBackground}};
    --paper: {{themeSurface}};
    --ink: #181210;
    --grey: #6b5e58;
    --line: #e6dabd;
    --green: #1f8a3e;
    --orange: #d97706;
    --blue: #1e6fbf;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ============================== PIN screen */
  .pin-screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .pin-card {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.4);
  }
  .pin-card h1 {
    font-family: 'Archivo Black', sans-serif;
    margin: 0 0 6px;
    font-size: 1.4rem;
  }
  .pin-card .sub { color: var(--grey); font-size: 0.9rem; margin-bottom: 20px; }
  .pin-input {
    font-family: 'Anton', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.4em;
    text-align: center;
    width: 100%;
    padding: 14px 12px 14px 24px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    margin-bottom: 12px;
    -moz-appearance: textfield;
  }
  .pin-input::-webkit-outer-spin-button,
  .pin-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .pin-error {
    color: var(--red);
    font-size: 0.92rem;
    min-height: 22px;
    margin-bottom: 8px;
  }
  .pin-btn {
    width: 100%;
    background: var(--ink);
    color: var(--yellow);
    border: 0;
    padding: 14px;
    border-radius: 12px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
  }
  .pin-btn:disabled { opacity: 0.5; }

  /* ============================== Header */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 4px solid var(--yellow);
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
  }
  .topbar .logo {
    height: 36px; width: 36px;
    border-radius: 9px;
    object-fit: cover;
    background: #fff;
    flex: 0 0 auto;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 11px;
    padding: 3px;
  }
  .tab {
    background: transparent;
    color: var(--paper);
    border: 0;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: background 0.12s;
  }
  .tab.active { background: var(--yellow); color: var(--ink); }
  .tab-count {
    background: var(--red);
    color: #fff;
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 0.74rem;
    min-width: 20px;
    text-align: center;
  }
  .tab.active .tab-count { background: var(--ink); color: var(--yellow); }
  .topbar .spacer { flex: 1; }
  .topbar .pulse {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(31,138,62,0.7);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(31,138,62,.7); }
    70% { box-shadow: 0 0 0 12px rgba(31,138,62,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,138,62,0); }
  }
  .topbar .stale { background: var(--red); animation: none; }
  .topbar button {
    background: transparent;
    color: var(--paper);
    border: 1px solid #5a4f49;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.9rem;
  }
  #refreshBtn { font-size: 1.1rem; line-height: 1; padding: 6px 11px; }
  #refreshBtn.spin { animation: spin 0.5s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================== Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    padding: 16px;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--grey);
    padding: 80px 16px;
    font-size: 1.05rem;
  }

  /* ============================== Card */
  .card {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 16px;
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,.05);
    position: relative;
  }
  .card.new {
    background: #fff8c8;
    border-color: var(--orange);
    animation: blink 1.2s ease-in-out 4;
  }
  @keyframes blink {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,118,6,.4); }
    50% { box-shadow: 0 0 0 8px rgba(217,118,6,0); }
  }
  .card.late { border-color: var(--red); }

  /* Subtle left-edge accent by status */
  .card.st-accepted  { box-shadow: inset 5px 0 0 var(--blue), 0 6px 0 rgba(0,0,0,.05); }
  .card.st-ready     { box-shadow: inset 5px 0 0 #c9a800, 0 6px 0 rgba(0,0,0,.05); }
  .card.st-out       { box-shadow: inset 5px 0 0 var(--blue), 0 6px 0 rgba(0,0,0,.05); }
  .card.st-completed { box-shadow: inset 5px 0 0 var(--green); }
  .card.st-cancelled { box-shadow: inset 5px 0 0 var(--grey); }
  .card.done { background: #faf6ec; }
  .card.done .ref { color: var(--grey); }

  /* ============================== Date-range toolbar (Recent / Z report) */
  .datebar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  /* The .datebar display:flex above would otherwise override the [hidden]
     attribute, so re-assert it — this is what keeps the bar off Live/Summary. */
  .datebar[hidden] { display: none; }
  .datebar button {
    border: 1.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font-weight: 700;
    font-size: 0.85rem;
  }
  .datebar button.dbapply { background: var(--ink); color: var(--yellow); }
  .datebar label { font-size: 0.85rem; color: var(--grey); display: flex; align-items: center; gap: 5px; }
  .datebar input[type=date] { border: 1.5px solid var(--ink); border-radius: 8px; padding: 6px 8px; background: #fff; }
  .datebar .dbspacer { flex: 1; min-width: 8px; }

  /* ============================== Z report */
  .zreport { grid-column: 1 / -1; }
  .zhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .zt { font-family: 'Archivo Black', sans-serif; font-size: 1.3rem; }
  .zsub { color: var(--grey); font-size: 0.9rem; }
  .zprintbtn { margin-left: auto; background: var(--ink); color: var(--yellow); border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; }
  .zfig {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .zbig { font-family: 'Anton', sans-serif; font-size: 2.6rem; line-height: 1; display: flex; flex-direction: column; color: var(--red); }
  .zbig span { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--grey); }
  .zg { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 12px; flex: 1; }
  .zg div { display: flex; flex-direction: column; }
  .zg b { font-size: 1.15rem; }
  .zg span { color: var(--grey); font-size: 0.78rem; }
  /* The Z report's order cards browse on screen; they're hidden when printing
     so a printed Z report is just the figures (the actual end-of-day reading). */
  .zorders {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    margin-top: 4px;
  }

  /* ============================== Summary view */
  .summary {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .summary .hero {
    grid-column: 1 / -1;
    background: var(--ink);
    color: var(--paper);
    border-radius: 16px;
    padding: 18px 22px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .summary .hero .big {
    font-family: 'Anton', sans-serif;
    font-size: 2.8rem;
    color: var(--yellow);
    line-height: 1;
  }
  .summary .hero .label { font-size: 0.98rem; opacity: 0.85; }
  .summary .hero .date { margin-left: auto; font-size: 0.9rem; opacity: 0.7; }
  .stat {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 6px 0 rgba(0,0,0,.05);
  }
  .stat .v { font-family: 'Anton', sans-serif; font-size: 1.7rem; line-height: 1; }
  .stat .k {
    color: var(--grey);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 6px;
  }
  .stat.split { display: flex; flex-direction: column; gap: 7px; justify-content: center; }
  .stat.split .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.95rem; }
  .stat.split .row span { color: var(--grey); }
  .stat.split .row b { font-size: 1.05rem; }

  .card-head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 8px;
  }

  /* Collapsible cards (Recent / Z report): tap the header to expand. Each card
     sizes to its own content (align-self:start) so expanding one doesn't stretch
     its neighbours into tall empty boxes. The header is two fixed rows so every
     collapsed card is the same height regardless of how many status pills it has. */
  .card.collapsible { align-self: start; }
  .chead { cursor: pointer; }
  .chead-top { display: flex; align-items: center; gap: 8px; }
  .chead-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .card.collapsible .chev { color: var(--grey); font-size: 0.85rem; transition: transform 0.12s; }
  .card.collapsible.open .chev { transform: rotate(90deg); }
  .head-total { margin-left: auto; font-family: 'Anton', sans-serif; font-size: 1.4rem; }
  .head-date { color: var(--grey); font-size: 0.82rem; }
  .card-body { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .card-body[hidden] { display: none; }
  .ref {
    font-family: 'Anton', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.04em;
  }
  .pill {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.06em;
  }
  .pill.collection { background: #cfe9d7; color: var(--green); }
  .pill.delivery   { background: #d1e2f3; color: var(--blue); }
  .pill.cash       { background: #fde7c8; color: var(--orange); }
  .pill.scheduled  { background: #efe2c1; color: #6b5410; }
  .pill.s-new       { background: #ffe0b3; color: #9a4b00; }
  .pill.s-accepted  { background: #d7e9ff; color: var(--blue); }
  .pill.s-ready     { background: #fff0a8; color: #6b5410; }
  .pill.s-out       { background: #d1e2f3; color: var(--blue); }
  .pill.s-completed { background: #cfe9d7; color: var(--green); }
  .pill.s-cancelled { background: #f3d2d2; color: var(--red); }

  .when { color: var(--grey); font-size: 0.85rem; margin-left: auto; }

  .lines {
    list-style: none;
    padding: 0; margin: 4px 0 0;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .lines li {
    display: flex;
    gap: 8px;
    padding: 3px 0;
    align-items: baseline;
    line-height: 1.3;
  }
  .lines .qty {
    font-family: 'Anton', sans-serif;
    font-size: 1.05rem;
    color: var(--red);
    min-width: 28px;
  }
  .lines .name { flex: 1; }
  .lines .mod  { color: var(--grey); font-size: 0.85rem; }

  .totals {
    border-top: 1px dashed var(--line);
    padding-top: 8px;
    font-size: 0.92rem;
    color: var(--grey);
  }
  .totals .total {
    color: var(--ink);
    font-weight: 700;
    font-size: 1rem;
    margin-top: 2px;
    display: flex;
    justify-content: space-between;
  }

  .who {
    background: #fff;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.92rem;
    border: 1px solid var(--line);
  }
  .who strong { display: block; }
  .who a { color: var(--red); text-decoration: none; }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .actions button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 10px 8px;
    font-weight: 700;
    font-size: 0.95rem;
    min-height: 44px;
  }
  .btn-accept   { background: var(--green); color: #fff; }
  .btn-ready    { background: var(--yellow); color: var(--ink); }
  .btn-out      { background: var(--blue); color: #fff; }
  .btn-complete { background: var(--ink); color: var(--paper); }
  .btn-print    { background: transparent; color: var(--ink); border: 1.5px solid var(--ink) !important; }
  .btn-cancel   { background: transparent; color: var(--red); border: 1.5px solid var(--red) !important; flex: 0 0 auto !important; }

  /* ============================== Modal */
  .ovl {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    place-items: center;
    z-index: 50;
    padding: 16px;
  }
  .ovl.open { display: grid; }
  .modal {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 20px;
    max-width: 380px;
    width: 100%;
  }
  .modal h2 {
    font-family: 'Archivo Black', sans-serif;
    margin: 0 0 12px;
    font-size: 1.1rem;
  }
  .prep-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .prep-grid button {
    padding: 14px 4px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    font-weight: 700;
  }
  .prep-grid button.active { background: var(--yellow); }
  .modal .row { display: flex; gap: 8px; }
  .modal .row button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    border: 0;
  }
  .modal .cancel { background: transparent; border: 2px solid var(--ink) !important; }
  .modal .confirm { background: var(--green); color: #fff; }

  /* ============================== New-order alarm popup */
  .ovl.alarm { background: rgba(60,0,0,0.6); z-index: 60; }
  .ovl.alarm .modal {
    border-color: var(--red);
    border-width: 4px;
    max-width: 440px;
    animation: alarmpulse 1.1s ease-in-out infinite;
  }
  @keyframes alarmpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(199,30,30,.55); }
    50% { box-shadow: 0 0 0 14px rgba(199,30,30,0); }
  }
  .alarm-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .alarm-head h2 { margin: 0; color: var(--red); font-size: 1.3rem; }
  .alarm-head .ref { font-size: 1.3rem; }
  .alarm-queue {
    margin-left: auto;
    background: var(--red); color: #fff;
    border-radius: 999px; padding: 4px 11px;
    font-weight: 700; font-size: 0.8rem; white-space: nowrap;
  }
  .alarm-body { max-height: 42vh; overflow-y: auto; margin-bottom: 14px; }
  .alarm-body .lines { border-top: 0; padding-top: 0; }
  .alarm-prep-label { text-align: center; color: var(--grey); font-size: 0.85rem; margin: 2px 0 8px; }
  .alarm-actions { display: flex; gap: 8px; }
  .alarm-actions button {
    flex: 1; border: 0; border-radius: 10px; padding: 14px;
    font-weight: 700; font-size: 1.02rem; min-height: 52px;
  }
  .alarm-actions .reject { background: transparent; color: var(--red); border: 2px solid var(--red) !important; flex: 0 0 38%; }
  .alarm-actions .accept { background: var(--green); color: #fff; }

  /* ============================== Print */
  @media print {
    header, .actions, .ovl, .topbar, .pin-screen, .datebar, .zprintbtn, .zorders, #refreshBtn { display: none !important; }
    body { background: #fff; color: #000; }
    .grid { display: block; padding: 0; }
    .card { page-break-after: always; box-shadow: none; border: 1.5px solid #000; max-width: 76mm; }
    .zreport { color: #000; }
    .zfig { border-color: #000 !important; }
    .zbig { color: #000; }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    .card.new, .topbar .pulse { animation: none !important; }
  }
</style>
</head>
<body>

<!-- ============================== PIN gate -->
<section id="pinScreen" class="pin-screen">
  <form id="pinForm" class="pin-card" autocomplete="off">
    <h1>{{shopShortName}} — staff orders</h1>
    <div class="sub">Enter the staff PIN to continue</div>
    <input type="number" inputmode="numeric" pattern="[0-9]*" class="pin-input"
           id="pinInput" maxlength="8" placeholder="••••" autofocus required />
    <div class="pin-error" id="pinError" aria-live="polite"></div>
    <button class="pin-btn" type="submit" id="pinSubmit">Unlock</button>
  </form>
</section>

<!-- ============================== Dashboard -->
<div id="dash" hidden>
  <header>
    <div class="topbar">
      <img src="/logo.png" class="logo" alt="" />
      <div class="tabs" role="tablist">
        <button class="tab active" data-view="live" role="tab">Live<span class="tab-count" id="liveCount">0</span></button>
        <button class="tab" data-view="done" role="tab">Recent</button>
        <button class="tab" data-view="summary" role="tab">Summary</button>
        <button class="tab" data-view="zreport" role="tab">Z report</button>
      </div>
      <div class="spacer"></div>
      <span class="pulse" id="pulse" title="Live — refreshes automatically"></span>
      <button id="refreshBtn" title="Refresh now" aria-label="Refresh">↻</button>
      <button id="soundToggle" title="Toggle sound">🔔 On</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="datebar" id="dateBar" hidden>
    <button data-preset="today">Today</button>
    <button data-preset="yesterday">Yesterday</button>
    <button data-preset="7d">Last 7 days</button>
    <button data-preset="thisweek">This week</button>
    <button data-preset="lastweek">Last week</button>
    <span class="dbspacer"></span>
    <label>From <input type="date" id="dateFrom" /></label>
    <label>To <input type="date" id="dateTo" /></label>
    <button id="dateApply" class="dbapply">View</button>
  </div>

  <main class="grid" id="grid">
    <div class="empty">No active orders. Sit tight — they'll appear here as they come in.</div>
  </main>
</div>

<!-- ============================== Accept modal -->
<div class="ovl" id="acceptOvl" role="dialog" aria-modal="true" aria-labelledby="acceptTitle">
  <div class="modal">
    <h2 id="acceptTitle">Ready in how long?</h2>
    <div class="prep-grid" id="prepGrid">
      <button data-min="15">15</button>
      <button data-min="20">20</button>
      <button data-min="25" class="active">25</button>
      <button data-min="30">30</button>
      <button data-min="35">35</button>
      <button data-min="40">40</button>
      <button data-min="45">45</button>
      <button data-min="60">60</button>
    </div>
    <div style="text-align:center;margin:-6px 0 14px;color:var(--grey);font-size:0.9rem">
      mins from now
    </div>
    <div class="row">
      <button class="cancel" id="acceptCancel">Cancel</button>
      <button class="confirm" id="acceptConfirm">Accept</button>
    </div>
  </div>
</div>

<!-- ============================== New-order alarm popup -->
<div class="ovl alarm" id="alarmOvl" role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle">
  <div class="modal">
    <div class="alarm-head">
      <h2 id="alarmTitle">🔔 New order</h2>
      <span class="ref" id="alarmRef"></span>
      <span class="alarm-queue" id="alarmQueue">new</span>
    </div>
    <div class="alarm-body" id="alarmBody"></div>
    <div class="prep-grid" id="alarmPrep">
      <button data-min="15">15</button>
      <button data-min="20">20</button>
      <button data-min="25" class="active">25</button>
      <button data-min="30">30</button>
      <button data-min="35">35</button>
      <button data-min="40">40</button>
      <button data-min="45">45</button>
      <button data-min="60">60</button>
    </div>
    <div class="alarm-prep-label">ready in (mins) — pick before accepting</div>
    <div class="alarm-actions">
      <button class="reject" id="alarmReject">Reject</button>
      <button class="accept" id="alarmAccept">Accept</button>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* ============================== Beep generator (no asset needed) */
const audio = (() => {
  let ctx = null;
  const ensure = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Browsers suspend the context (autoplay policy, or when the tab was
    // backgrounded); resume so the chime actually plays.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  };
  function tone(freq, ms, when = 0, vol = 0.3) {
    const c = ensure();
    const o = c.createOscillator();
    const g = c.createGain();
    o.frequency.value = freq;
    o.type = 'sine';
    o.connect(g).connect(c.destination);
    g.gain.setValueAtTime(0, c.currentTime + when);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + when + 0.02);
    g.gain.linearRampToValueAtTime(0, c.currentTime + when + ms / 1000);
    o.start(c.currentTime + when);
    o.stop(c.currentTime + when + ms / 1000 + 0.05);
  }
  return {
    chime() {
      tone(880, 180, 0);
      tone(1320, 220, 0.18);
      tone(880, 180, 0.42);
    },
    unlock() { try { ensure(); } catch {} },
  };
})();

// Any tap/click/key on the device resumes a suspended AudioContext, so the
// new-order chime reliably rings even if the page was opened without a gesture
// (e.g. an existing session) or the tab had been backgrounded.
['pointerdown', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => audio.unlock(), { capture: true }));

/* ============================== State */
const state = {
  authed: false,
  orders: [],
  seenIds: new Set(),
  soundOn: localStorage.getItem('ricos-sound') !== 'off',
  pollHandle: null,
  lastPollAt: 0,
  alarmHandle: null,   // setInterval for the repeating new-order chime
  alarmId: null,       // order id currently shown in the alarm popup
  alarmMin: 25,        // prep minutes selected in the alarm popup
  view: 'live',        // live | done (Recent) | summary | zreport
  doneOrders: [],      // cache for the Recent view
  from: '',            // selected London-day range (Recent + Z report)
  to: '',
};

function setSoundLabel() {
  $('#soundToggle').textContent = state.soundOn ? '🔔 On' : '🔕 Off';
}
setSoundLabel();
$('#soundToggle').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  localStorage.setItem('ricos-sound', state.soundOn ? 'on' : 'off');
  setSoundLabel();
  if (state.soundOn) audio.chime(); // unlock audio context
});

/* ============================== Date range (London calendar days) */
function ymdToday() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' }); }
function ymdShift(ymd, days) {
  const d = new Date(ymd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function ymdDowMon0(ymd) { return (new Date(ymd + 'T00:00:00Z').getUTCDay() + 6) % 7; } // 0=Mon..6=Sun
function presetRange(preset) {
  const today = ymdToday();
  if (preset === 'yesterday') { const y = ymdShift(today, -1); return { from: y, to: y }; }
  if (preset === '7d') return { from: ymdShift(today, -6), to: today };
  if (preset === 'thisweek') return { from: ymdShift(today, -ymdDowMon0(today)), to: today };
  if (preset === 'lastweek') {
    const wkStart = ymdShift(today, -ymdDowMon0(today));
    return { from: ymdShift(wkStart, -7), to: ymdShift(wkStart, -1) };
  }
  return { from: today, to: today };
}
function applyRangeToInputs() {
  $('#dateFrom').value = state.from;
  $('#dateTo').value = state.to;
}
function reloadRangeView() {
  if (state.view === 'done') loadDone();
  else if (state.view === 'zreport') loadReport(false);
}

/* ============================== View tabs */
function setView(view) {
  state.view = view;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  const usesRange = (view === 'done' || view === 'zreport');
  $('#dateBar').hidden = !usesRange;
  if (usesRange) applyRangeToInputs();
  if (view === 'done') loadDone();
  else if (view === 'summary') loadSummary(false);
  else if (view === 'zreport') loadReport(false);
  else renderList(state.orders);
}
$$('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
$('#refreshBtn').addEventListener('click', () => {
  $('#refreshBtn').classList.add('spin');
  setTimeout(() => $('#refreshBtn').classList.remove('spin'), 500);
  if (state.view === 'done') loadDone();
  else if (state.view === 'summary') loadSummary(false);
  else if (state.view === 'zreport') loadReport(false);
  else poll();
});
$$('#dateBar [data-preset]').forEach(b => b.addEventListener('click', () => {
  const r = presetRange(b.dataset.preset);
  state.from = r.from; state.to = r.to;
  applyRangeToInputs();
  reloadRangeView();
}));
$('#dateApply').addEventListener('click', () => {
  const f = $('#dateFrom').value, t = $('#dateTo').value;
  if (!f || !t) return;
  state.from = f <= t ? f : t;
  state.to = f <= t ? t : f;
  applyRangeToInputs();
  reloadRangeView();
});

/* ============================== Auth */
$('#pinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#pinError').textContent = '';
  $('#pinSubmit').disabled = true;
  try {
    const pin = $('#pinInput').value.trim();
    const res = await fetch('/api/staff/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      $('#pinError').textContent = j.error || `Error ${res.status}`;
      return;
    }
    enterDashboard();
  } catch (err) {
    $('#pinError').textContent = 'Network error — try again.';
  } finally {
    $('#pinSubmit').disabled = false;
  }
});

$('#logoutBtn').addEventListener('click', () => {
  document.cookie = 'rs=; Max-Age=0; Path=/; Secure; SameSite=Lax';
  if (state.pollHandle) clearInterval(state.pollHandle);
  stopAlarm();
  $('#alarmOvl').classList.remove('open');
  state.alarmId = null;
  $('#dash').hidden = true;
  $('#pinScreen').style.display = 'grid';
  $('#pinInput').value = '';
  $('#pinInput').focus();
});

function enterDashboard() {
  state.authed = true;
  if (!state.from) { state.from = state.to = ymdToday(); }
  $('#pinScreen').style.display = 'none';
  $('#dash').hidden = false;
  // Prime the audio context with a silent tone so iOS lets us play later.
  if (state.soundOn) {
    try { audio.chime(); } catch {}
  }
  poll();
  state.pollHandle = setInterval(poll, 5000);
}

/* ============================== Poll + render */
async function poll() {
  try {
    const res = await fetch('/api/staff/orders', { cache: 'no-store' });
    if (res.status === 401) {
      // Session expired.
      $('#logoutBtn').click();
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.lastPollAt = Date.now();
    state.pollTick = (state.pollTick || 0) + 1;
    $('#pulse').classList.remove('stale');
    handleOrders(data.orders || []);
    // Refresh the Summary figures periodically (~30s), not on every 5s poll —
    // it does a date-range scan, so we keep it off the live cadence.
    if (state.view === 'summary' && state.pollTick % 6 === 0) loadSummary(true);
  } catch (e) {
    console.error('poll failed', e);
    $('#pulse').classList.add('stale');
  }
}

function handleOrders(orders) {
  const newIds = orders
    .filter(o => o.status === 'pending_accept' && !state.seenIds.has(o.id))
    .map(o => o.id);
  for (const o of orders) state.seenIds.add(o.id);

  state.orders = orders;
  $('#liveCount').textContent = orders.length;
  // Only repaint the grid when the Live tab is showing; the Recent tab keeps
  // its own list. Polling continues in the background so the alarm still fires
  // even while staff are looking at history.
  if (state.view === 'live') renderList(orders, newIds);
  // The repeating alarm + popup are driven entirely by whether any orders are
  // still waiting to be accepted — that set IS the queue.
  syncAlarm();
}

function renderList(list, newIds = []) {
  const grid = $('#grid');
  if (!list || list.length === 0) {
    grid.innerHTML = state.view === 'done'
      ? '<div class="empty">No completed or cancelled orders for the selected dates. Use the date bar above to pick another day or range.</div>'
      : '<div class="empty">No active orders. Sit tight — they\'ll appear here as they come in.</div>';
    return;
  }
  const collapsed = state.view === 'done';
  grid.innerHTML = list.map(o => renderCard(o, newIds.includes(o.id), collapsed)).join('');
  wireCardButtons();
}

function wireCardButtons() {
  $$('.card .btn-accept').forEach(b => b.addEventListener('click', () => openAccept(b.dataset.id)));
  $$('.card .btn-ready').forEach(b => b.addEventListener('click', () => updateStatus(b.dataset.id, 'ready')));
  $$('.card .btn-out').forEach(b => b.addEventListener('click', () => updateStatus(b.dataset.id, 'out_for_delivery')));
  $$('.card .btn-complete').forEach(b => b.addEventListener('click', () => updateStatus(b.dataset.id, 'completed')));
  $$('.card .btn-cancel').forEach(b => b.addEventListener('click', () => {
    if (confirm('Cancel this order? The customer is notified and any card payment is refunded automatically.')) {
      updateStatus(b.dataset.id, 'cancelled');
    }
  }));
  $$('.card .btn-print').forEach(b => b.addEventListener('click', () => printOrder(b.dataset.id)));
  // Expand/collapse Recent cards by tapping their header (ignore button/link taps).
  $$('.card.collapsible').forEach(card => {
    const head = card.querySelector('.chead');
    head.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      const body = card.querySelector('.card-body');
      if (!body) return;
      const willOpen = body.hasAttribute('hidden');
      body.toggleAttribute('hidden', !willOpen);
      card.classList.toggle('open', willOpen);
    });
  });
}

async function loadDone() {
  const grid = $('#grid');
  grid.innerHTML = '<div class="empty">Loading orders…</div>';
  try {
    const res = await fetch(`/api/staff/orders?view=done&from=${state.from}&to=${state.to}`, { cache: 'no-store' });
    if (res.status === 401) { $('#logoutBtn').click(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.doneOrders = data.orders || [];
  } catch (e) {
    grid.innerHTML = '<div class="empty">Couldn\'t load orders. Tap ↻ to retry.</div>';
    return;
  }
  if (state.view === 'done') renderList(state.doneOrders);
}

async function loadSummary(silent) {
  const grid = $('#grid');
  if (!silent) grid.innerHTML = '<div class="empty">Loading today\'s figures…</div>';
  let s;
  try {
    const res = await fetch('/api/staff/summary', { cache: 'no-store' });
    if (res.status === 401) { $('#logoutBtn').click(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    s = (await res.json()).summary;
  } catch (e) {
    if (!silent) grid.innerHTML = '<div class="empty">Couldn\'t load the summary. Tap ↻ to retry.</div>';
    return;
  }
  if (state.view === 'summary' && s) renderSummary(s);
}

async function loadReport(silent) {
  const grid = $('#grid');
  if (!silent) grid.innerHTML = '<div class="empty">Loading report…</div>';
  let data;
  try {
    const res = await fetch(`/api/staff/summary?from=${state.from}&to=${state.to}`, { cache: 'no-store' });
    if (res.status === 401) { $('#logoutBtn').click(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    if (!silent) grid.innerHTML = '<div class="empty">Couldn\'t load the report. Tap ↻ to retry.</div>';
    return;
  }
  if (state.view === 'zreport' && data?.summary) renderReport(data.summary, data.orders || []);
}

function renderReport(s, orders) {
  const gbp = p => `£${((p || 0) / 100).toFixed(2)}`;
  const fmtDay = ymd => new Date(ymd + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const rangeLabel = s.from === s.to ? fmtDay(s.from) : `${fmtDay(s.from)} → ${fmtDay(s.to)}`;
  const figures = `
    <div class="zreport">
      <div class="zhead">
        <div>
          <div class="zt">Z report</div>
          <div class="zsub">${escapeHtml(rangeLabel)}</div>
        </div>
        <button id="zprint" class="zprintbtn">Print report</button>
      </div>
      <div class="zfig">
        <div class="zbig">${gbp(s.grossP)}<span>taken · ${s.orderCount} order${s.orderCount === 1 ? '' : 's'}</span></div>
        <div class="zg">
          <div><b>${gbp(s.avgP)}</b><span>avg order</span></div>
          <div><b>${gbp(s.card.grossP)}</b><span>card (${s.card.count})</span></div>
          <div><b>${gbp(s.cash.grossP)}</b><span>cash (${s.cash.count})</span></div>
          <div><b>${s.collection}</b><span>collection</span></div>
          <div><b>${s.delivery}</b><span>delivery</span></div>
          <div><b>${s.completed}</b><span>completed</span></div>
          <div><b>${s.cancelled}</b><span>cancelled</span></div>
          <div><b>${gbp(s.refundedP)}</b><span>refunded</span></div>
          <div><b>${gbp(s.serviceFeeP)}</b><span>service fees</span></div>
          <div><b>${gbp(s.deliveryFeeP)}</b><span>delivery fees</span></div>
        </div>
      </div>
    </div>`;
  const cards = orders.length
    ? `<div class="zorders">${orders.map(o => renderCard(o, false, true, true)).join('')}</div>`
    : '<div class="empty">No orders in this range.</div>';
  $('#grid').innerHTML = figures + cards;
  $('#zprint').addEventListener('click', () => window.print());
  wireCardButtons();   // wires the collapse/expand toggles on the report's cards
}

function renderSummary(s) {
  const gbp = p => `£${((p || 0) / 100).toFixed(2)}`;
  const dateLabel = new Date(s.from + 'T12:00:00')
    .toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#grid').innerHTML = `
    <div class="summary">
      <div class="hero">
        <span class="big">${gbp(s.grossP)}</span>
        <span class="label">taken today · ${s.orderCount} order${s.orderCount === 1 ? '' : 's'}</span>
        <span class="date">${escapeHtml(dateLabel)}</span>
      </div>
      <div class="stat"><div class="v">${s.orderCount}</div><div class="k">Orders</div></div>
      <div class="stat"><div class="v">${gbp(s.avgP)}</div><div class="k">Avg order</div></div>
      <div class="stat split">
        <div class="row"><span>Card</span><b>${gbp(s.card.grossP)}</b></div>
        <div class="row"><span>Cash</span><b>${gbp(s.cash.grossP)}</b></div>
        <div class="k">${s.card.count} card · ${s.cash.count} cash</div>
      </div>
      <div class="stat split">
        <div class="row"><span>Collection</span><b>${s.collection}</b></div>
        <div class="row"><span>Delivery</span><b>${s.delivery}</b></div>
        <div class="k">delivery fees ${gbp(s.deliveryFeeP)}</div>
      </div>
      <div class="stat split">
        <div class="row"><span>In progress</span><b>${s.inProgress}</b></div>
        <div class="row"><span>Completed</span><b>${s.completed}</b></div>
        <div class="row"><span>Cancelled</span><b>${s.cancelled}</b></div>
      </div>
      <div class="stat"><div class="v">${gbp(s.serviceFeeP)}</div><div class="k">Service fees (platform)</div></div>
    </div>`;
}

function renderCard(o, isNew, collapsed = false, readOnly = false) {
  const cls = ['card'];
  if (isNew) cls.push('new');
  if (isLate(o)) cls.push('late');
  const stClass = { accepted: 'st-accepted', ready: 'st-ready', out_for_delivery: 'st-out', completed: 'st-completed', cancelled: 'st-cancelled' };
  if (stClass[o.status]) cls.push(stClass[o.status]);
  if (o.status === 'completed' || o.status === 'cancelled') cls.push('done');
  if (collapsed) cls.push('collapsible');

  const placedAgo = humanAgo(new Date(o.createdAt));
  const stLabel = { pending_accept: 'new', accepted: 'accepted', ready: 'ready', out_for_delivery: 'out for delivery', completed: 'completed', cancelled: 'cancelled' };
  const stPillCls = { pending_accept: 's-new', accepted: 's-accepted', ready: 's-ready', out_for_delivery: 's-out', completed: 's-completed', cancelled: 's-cancelled' };
  const statusPill = stLabel[o.status]
    ? `<span class="pill ${stPillCls[o.status]}">${stLabel[o.status]}</span>`
    : '';
  const refundPill = (o.status === 'cancelled' && o.paymentMethod === 'card' && o.payment?.refund)
    ? (o.payment.refund.state === 'succeeded'
        ? '<span class="pill s-completed">refunded</span>'
        : '<span class="pill s-cancelled">refund: manual</span>')
    : '';
  const fulfillmentPill = o.fulfillment === 'delivery'
    ? '<span class="pill delivery">delivery</span>'
    : '<span class="pill collection">collection</span>';
  const cashPill = o.paymentMethod !== 'card'
    ? `<span class="pill cash">${o.paymentMethod === 'cash_collection' ? 'cash on collect' : 'cash on delivery'}</span>`
    : '';
  const schedPill = o.schedule && o.schedule !== 'asap'
    ? `<span class="pill scheduled">${formatTime(o.schedule)}</span>`
    : '';

  const lines = lineItemsHtml(o);

  const addr = o.address ? `<div style="font-size:0.85rem;color:var(--grey);margin-top:4px">${escapeHtml(o.address.line1)}${o.address.line2 ? ', ' + escapeHtml(o.address.line2) : ''}, ${escapeHtml(o.address.postcode)}${o.address.notes ? `<br><em>${escapeHtml(o.address.notes)}</em>` : ''}</div>` : '';

  const totals = `
    <div class="totals">
      <div>${o.totals.lines.length} items · subtotal £${(o.totals.subtotalP/100).toFixed(2)}</div>
      ${o.totals.discountP ? `<div>${escapeHtml(o.totals.discountLabel || 'Discount')}: −£${(o.totals.discountP/100).toFixed(2)}</div>` : ''}
      ${o.totals.deliveryFeeP ? `<div>Delivery: £${(o.totals.deliveryFeeP/100).toFixed(2)}</div>` : ''}
      <div class="total"><span>Total</span><span>£${(o.totals.totalP/100).toFixed(2)}</span></div>
    </div>`;

  let actions = '';
  if (o.status === 'pending_accept') {
    actions = `
      <button class="btn-accept" data-id="${o.id}">Accept →</button>
      <button class="btn-print" data-id="${o.id}">Print</button>
      <button class="btn-cancel" data-id="${o.id}">Cancel</button>`;
  } else if (o.status === 'accepted') {
    const verb = o.fulfillment === 'delivery' ? '→ Out' : '→ Ready';
    const cls = o.fulfillment === 'delivery' ? 'btn-out' : 'btn-ready';
    const status = o.fulfillment === 'delivery' ? 'out_for_delivery' : 'ready';
    actions = `
      <button class="${cls}" data-id="${o.id}" data-status="${status}">${verb}</button>
      <button class="btn-print" data-id="${o.id}">Print</button>`;
  } else if (o.status === 'ready' || o.status === 'out_for_delivery') {
    actions = `
      <button class="btn-complete" data-id="${o.id}">→ Complete</button>
      <button class="btn-print" data-id="${o.id}">Print</button>`;
  } else if (o.status === 'completed' || o.status === 'cancelled') {
    actions = `<button class="btn-print" data-id="${o.id}">Print</button>`;
  }
  if (readOnly) actions = '';   // Z report cards are view-only

  const dateLabel = formatDate(o.createdAt);
  const ready = o.readyAt
    ? `<div class="when">${dateLabel} · ready ${formatTime(o.readyAt)}</div>`
    : `<div class="when">${dateLabel} · ${placedAgo}</div>`;

  const detail = `
      <ul class="lines">${lines}</ul>
      <div class="who">
        <strong>${escapeHtml(o.customer.name)}</strong>
        <a href="tel:${escapeHtml(o.customer.phone)}">${escapeHtml(o.customer.phone)}</a>
        ${addr}
      </div>
      ${totals}
      <div class="actions">${actions}</div>`;

  // Recent cards start collapsed: just ref + status + total. Tapping the header
  // expands the full order. Live cards always show everything (the kitchen
  // needs it at a glance).
  if (collapsed) {
    return `
    <article class="${cls.join(' ')}">
      <div class="chead">
        <div class="chead-top">
          <span class="chev">▸</span>
          <span class="ref">#${escapeHtml(o.id)}</span>
          <span class="head-total">£${(o.totals.totalP/100).toFixed(2)}</span>
        </div>
        <div class="chead-sub">
          <span class="head-date">${dateLabel}</span>
          ${statusPill}
          ${refundPill}
        </div>
      </div>
      <div class="card-body" hidden>
        <div class="card-head">${fulfillmentPill}${cashPill}${schedPill}${ready}</div>
        ${detail}
      </div>
    </article>`;
  }

  return `
    <article class="${cls.join(' ')}">
      <div class="card-head">
        <span class="ref">#${escapeHtml(o.id)}</span>
        ${statusPill}
        ${refundPill}
        ${fulfillmentPill}
        ${cashPill}
        ${schedPill}
        ${ready}
      </div>
      ${detail}
    </article>`;
}

function isLate(o) {
  if (!o.readyAt) return false;
  return Date.now() > new Date(o.readyAt).getTime() + 5 * 60000;
}

function humanAgo(d) {
  const sec = Math.round((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return `${sec}s ago`;
  const min = Math.round(sec / 60);
  if (min < 60) return `${min}m ago`;
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' });
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { timeZone: 'Europe/London', day: '2-digit', month: 'short' });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function lineItemsHtml(o) {
  return (o.totals.lines || []).map(l => `
    <li>
      <span class="qty">${l.qty}×</span>
      <span class="name">${escapeHtml(l.name)}${l.spice ? ` <span class="mod" style="background:#ffe1d4;color:#a8331a;font-weight:600">${escapeHtml(l.spice)}</span>` : ''}${l.meal ? ' <span class="mod">(meal)</span>' : ''}${l.mealChoices && l.mealChoices.length ? ` <span class="mod">(${l.mealChoices.map(escapeHtml).join(', ')})</span>` : ''}${l.modifiers && l.modifiers.length ? ` <span class="mod">(${l.modifiers.map(escapeHtml).join(', ')})</span>` : ''}</span>
    </li>`).join('');
}

/* ============================== New-order alarm + queue
   Orders still in 'pending_accept' ARE the queue. While any exist we show a
   demanding popup for the oldest one and repeat the chime until it's accepted
   or rejected; clearing one advances to the next automatically. */
function pendingQueue() {
  // listActiveOrders already returns oldest-first.
  return state.orders.filter(o => o.status === 'pending_accept');
}

function syncAlarm() {
  const q = pendingQueue();
  if (q.length === 0) {
    stopAlarm();
    $('#alarmOvl').classList.remove('open');
    state.alarmId = null;
    return;
  }
  const cur = q[0];
  if (state.alarmId !== cur.id) {
    state.alarmId = cur.id;
    state.alarmMin = 25;
    renderAlarm(cur, q.length);
  } else {
    $('#alarmQueue').textContent = q.length > 1 ? `${q.length} waiting` : 'new';
  }
  $('#alarmOvl').classList.add('open');
  startAlarm();
}

function renderAlarm(o, qlen) {
  $('#alarmRef').textContent = `#${o.id}`;
  $('#alarmQueue').textContent = qlen > 1 ? `${qlen} waiting` : 'new';

  const fulfillment = o.fulfillment === 'delivery' ? 'Delivery' : 'Collection';
  const pay = o.paymentMethod === 'card' ? 'Paid by card'
    : (o.paymentMethod === 'cash_collection' ? 'CASH on collection' : 'CASH on delivery');
  const sched = o.schedule && o.schedule !== 'asap' ? ` · for ${formatTime(o.schedule)}` : ' · ASAP';
  const addr = o.address
    ? `<div style="font-size:0.88rem;color:var(--grey);margin-top:4px">${escapeHtml(o.address.line1)}${o.address.line2 ? ', ' + escapeHtml(o.address.line2) : ''}, ${escapeHtml(o.address.postcode)}${o.address.notes ? `<br><em>${escapeHtml(o.address.notes)}</em>` : ''}</div>`
    : '';

  $('#alarmBody').innerHTML = `
    <div style="font-weight:700;margin-bottom:6px">${fulfillment}${sched} · ${pay}</div>
    <ul class="lines">${lineItemsHtml(o)}</ul>
    <div class="totals">
      <div class="total"><span>Total</span><span>£${(o.totals.totalP/100).toFixed(2)}</span></div>
    </div>
    <div class="who" style="margin-top:10px">
      <strong>${escapeHtml(o.customer.name)}</strong>
      <a href="tel:${escapeHtml(o.customer.phone)}">${escapeHtml(o.customer.phone)}</a>
      ${addr}
    </div>`;

  $$('#alarmPrep button').forEach(x => x.classList.toggle('active', Number(x.dataset.min) === state.alarmMin));
}

function startAlarm() {
  if (state.alarmHandle) return;
  if (state.soundOn) audio.chime();
  state.alarmHandle = setInterval(() => { if (state.soundOn) audio.chime(); }, 2500);
}
function stopAlarm() {
  if (state.alarmHandle) { clearInterval(state.alarmHandle); state.alarmHandle = null; }
}

$$('#alarmPrep button').forEach(b => {
  b.addEventListener('click', () => {
    $$('#alarmPrep button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.alarmMin = Number(b.dataset.min);
  });
});

$('#alarmAccept').addEventListener('click', async () => {
  const id = state.alarmId;
  if (!id) return;
  $('#alarmAccept').disabled = true;
  try {
    await acceptOrder(id, state.alarmMin);
    state.alarmId = null;   // force the next pending order to render fresh
    setView('live');        // land on the live board after accepting
    await poll();           // poll() -> syncAlarm() advances or closes
  } catch (e) {
    alert(e.message || 'Could not accept — try again.');
  } finally {
    $('#alarmAccept').disabled = false;
  }
});

$('#alarmReject').addEventListener('click', async () => {
  const id = state.alarmId;
  if (!id) return;
  if (!confirm('Reject this order? The customer is notified and any card payment is refunded automatically.')) return;
  $('#alarmReject').disabled = true;
  try {
    const r = await sendStatus(id, 'cancelled');
    state.alarmId = null;
    await poll();
    noteRefund(r);
  } catch (e) {
    alert(e.message || 'Could not reject — try again.');
  } finally {
    $('#alarmReject').disabled = false;
  }
});

/* ============================== Accept modal */
let acceptingId = null;
let acceptMin = 25;

$$('#prepGrid button').forEach(b => {
  b.addEventListener('click', () => {
    $$('#prepGrid button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    acceptMin = Number(b.dataset.min);
  });
});
$('#acceptCancel').addEventListener('click', () => closeAccept());
$('#acceptOvl').addEventListener('click', (e) => {
  if (e.target.id === 'acceptOvl') closeAccept();
});
$('#acceptConfirm').addEventListener('click', async () => {
  if (!acceptingId) return;
  $('#acceptConfirm').disabled = true;
  try {
    await acceptOrder(acceptingId, acceptMin);
    closeAccept();
    poll();
  } catch (e) {
    alert(e.message || 'Could not accept — try again.');
  } finally {
    $('#acceptConfirm').disabled = false;
  }
});

async function acceptOrder(id, prepMinutes) {
  const res = await fetch(`/api/staff/orders/${id}/accept`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prepMinutes }),
  });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Error ${res.status}`);
  }
  return res.json();
}

function openAccept(id) {
  acceptingId = id;
  acceptMin = 25;
  $$('#prepGrid button').forEach(x => x.classList.toggle('active', Number(x.dataset.min) === 25));
  $('#acceptOvl').classList.add('open');
}
function closeAccept() {
  acceptingId = null;
  $('#acceptOvl').classList.remove('open');
}

/* ============================== Status updates */
async function sendStatus(id, status, reason) {
  const res = await fetch(`/api/staff/orders/${id}/status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(reason ? { status, reason } : { status }),
  });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Error ${res.status}`);
  }
  return res.json();
}

// Alert staff only when the automatic refund failed — they must do it by hand.
function noteRefund(result) {
  if (result && result.refund && result.refund.ok === false) {
    alert('Order rejected — but the automatic card refund FAILED.\nPlease refund it manually in Stripe.\n\n' + (result.refund.error || ''));
  }
}

async function updateStatus(id, status) {
  try {
    const r = await sendStatus(id, status);
    poll();
    noteRefund(r);
  } catch (e) {
    alert(e.message || 'Network error — try again.');
  }
}

/* ============================== Print */
function printOrder(id) {
  // Browser print of just the matching card. We add a class that hides others
  // via @media print rules above.
  const card = $$('.card').find(c => c.querySelector(`[data-id="${id}"]`));
  if (!card) { window.print(); return; }
  $$('.card').forEach(c => c.style.display = (c === card ? '' : 'none'));
  window.print();
  setTimeout(() => $$('.card').forEach(c => c.style.display = ''), 250);
}

/* ============================== Auto-detect existing session */
(async () => {
  try {
    const res = await fetch('/api/staff/orders', { cache: 'no-store' });
    if (res.ok) enterDashboard();
  } catch {}
})();
</script>
