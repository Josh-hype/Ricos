<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>{{shopShortName}} — orders</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="{{shopShortName}} orders" />
<meta name="theme-color" content="#0B1A2E" />
<link rel="manifest" href="/staff/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root{
  --blue:#0070F0; --blue-600:#0061D6; --blue-700:#0050B4; --blue-tint:#E9F2FF; --blue-tint-2:#F4F8FF;
  --ink:#0B1A2E; --ink-2:#33445C; --muted:#7488A0; --muted-2:#9AABBF;
  --canvas:#EEF2F7; --panel:#FFFFFF; --line:#E4EAF1; --line-2:#EFF3F8;
  --green:#0E9F6E; --green-tint:#E4F6EE;
  --amber:#B7791F; --amber-bg:#F4A82E; --amber-tint:#FBF1DF;
  --red:#E0464B; --red-tint:#FBECEC;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --sh-sm:0 1px 2px rgba(11,26,46,.05), 0 1px 3px rgba(11,26,46,.04);
  --sh:0 4px 14px rgba(11,26,46,.06), 0 1px 3px rgba(11,26,46,.05);
  --sh-lg:0 24px 60px rgba(11,26,46,.18), 0 6px 18px rgba(11,26,46,.10);
  --mono:'DM Mono',ui-monospace,monospace;
  --sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--canvas);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overscroll-behavior-y:contain;
  font-feature-settings:"ss01","cv01";
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.02em}
.tnum{font-variant-numeric:tabular-nums}

/* ============================== PIN screen */
.pin-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--canvas)}
.pin-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:36px 32px;width:100%;max-width:380px;text-align:center;box-shadow:var(--sh-lg);
}
.pin-card h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.pin-card .sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:24px}
.pin-input{
  font-family:var(--mono);font-size:30px;letter-spacing:.4em;text-align:center;
  width:100%;padding:16px 12px 16px 24px;border:1px solid var(--line);
  border-radius:14px;background:var(--canvas);margin-bottom:12px;-moz-appearance:textfield;
}
.pin-input::-webkit-outer-spin-button,.pin-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pin-input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue-tint)}
.pin-error{color:var(--red);font-size:13px;min-height:22px;margin-bottom:8px;font-weight:500}
.pin-btn{
  width:100%;background:linear-gradient(135deg,#0A86FF,#0070F0 60%,#0058C4);
  color:#fff;padding:15px;border-radius:14px;font-size:15px;font-weight:700;
  letter-spacing:-.01em;box-shadow:0 10px 24px rgba(0,112,240,.34);transition:.16s;
}
.pin-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,112,240,.42)}
.pin-btn:disabled{opacity:.5;box-shadow:none;transform:none;cursor:not-allowed}

/* ============================== App shell (rail + stage) */
#dash{display:grid;grid-template-columns:88px 1fr;height:100vh;min-height:100vh;overflow:hidden}
@media(min-width:1200px){#dash{grid-template-columns:96px 1fr}}

/* Rail */
.rail{
  background:linear-gradient(180deg,#0B1A2E 0%,#0E2237 100%);
  display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;
  position:relative;z-index:5;overflow:hidden;
}
.rail::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 0% 0%,rgba(0,112,240,.22),transparent 60%);pointer-events:none}
.rail .brand{
  width:48px;height:48px;border-radius:14px;
  background:linear-gradient(150deg,#2D9BFF,#0070F0 55%,#0050B4);
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,112,240,.45);
  margin-bottom:26px;flex:none;padding:6px;
}
.rail .brand img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.tabs{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;flex:1;padding:0}
.tab{
  width:62px;height:60px;border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:#8CA2BC;transition:.18s cubic-bezier(.4,0,.2,1);
  position:relative;padding:0;background:transparent;border:0;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;
}
.tab svg{width:22px;height:22px;stroke-width:1.9}
.tab:hover{color:#D6E4F5;background:rgba(255,255,255,.05)}
.tab.active{color:#fff;background:rgba(0,112,240,.18)}
.tab.active::before{
  content:"";position:absolute;left:-13px;top:50%;transform:translateY(-50%);
  width:4px;height:26px;background:var(--blue);border-radius:0 4px 4px 0;
  box-shadow:0 0 14px var(--blue);
}
.tab-count{
  background:var(--red);color:#fff;border-radius:999px;padding:1px 6px;
  font-size:9.5px;font-weight:800;min-width:16px;text-align:center;line-height:1.4;
  display:inline-block;margin-left:2px;
}
.tab.active .tab-count{background:var(--blue)}
.rail-foot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding-top:8px}
.rail-divider{width:40px;height:1px;background:rgba(255,255,255,.09)}
.avatar-btn{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(140deg,#3a4d66,#22344b);
  display:grid;place-items:center;color:#cde0f5;
  border:1.5px solid rgba(255,255,255,.12);transition:.15s;
}
.avatar-btn:hover{background:rgba(224,70,75,.2);color:#fff;border-color:rgba(224,70,75,.4)}
.avatar-btn svg{width:18px;height:18px;stroke-width:2}

/* Stage */
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}

/* Topbar */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 24px 12px;flex:none}
.loc{display:flex;flex-direction:column;gap:1px;min-width:0}
.loc .name{font-size:18px;font-weight:800;letter-spacing:-.02em}
.loc .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.top-spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;
  border-radius:11px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--sh-sm);
}
.chip.live{color:var(--green)}
.pulse{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(14,159,110,.5);animation:pulse 2.4s infinite;
}
.pulse.stale{background:var(--red);animation:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(14,159,110,.45)}
  70%{box-shadow:0 0 0 7px rgba(14,159,110,0)}
  100%{box-shadow:0 0 0 0 rgba(14,159,110,0)}
}
.topbar button:not(.chip){
  height:38px;border-radius:11px;padding:0 14px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
  font-size:13px;font-weight:600;box-shadow:var(--sh-sm);transition:.15s;
}
.topbar button:not(.chip):hover{border-color:var(--blue);color:var(--blue)}
#refreshBtn{font-size:16px;line-height:1;padding:0 14px}
#refreshBtn.spin{animation:spin .5s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* Date bar */
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 24px 14px;flex:none}
.datebar[hidden]{display:none}
.datebar button{
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  border-radius:10px;padding:8px 13px;font-weight:600;font-size:12.5px;
  box-shadow:var(--sh-sm);transition:.15s;
}
.datebar button:hover{border-color:var(--blue);color:var(--blue)}
.datebar button.dbapply{
  background:linear-gradient(135deg,#0A86FF,#0070F0);color:#fff;border-color:transparent;
  box-shadow:0 6px 14px rgba(0,112,240,.3);
}
.datebar button.dbapply:hover{color:#fff;transform:translateY(-1px)}
.datebar label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.datebar input[type=date]{
  border:1px solid var(--line);border-radius:10px;padding:7px 9px;
  background:var(--panel);font-size:13px;color:var(--ink);
}
.datebar input[type=date]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.datebar .dbspacer{flex:1;min-width:8px}

/* Grid */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;padding:4px 24px 24px;flex:1;overflow-y:auto;align-content:start;
}
.grid::-webkit-scrollbar{width:8px}
.grid::-webkit-scrollbar-thumb{background:#D4DEEA;border-radius:8px}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);
  padding:80px 16px;font-size:14px;font-weight:500;
}

/* Cards */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--sh-sm);position:relative;transition:.16s;animation:cardIn .35s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{box-shadow:var(--sh)}
.card.new{
  border-color:var(--amber-bg);background:#FFFCF3;
  animation:cardIn .35s cubic-bezier(.16,1,.3,1) both, blink 1.2s ease-in-out 4 .5s;
}
@keyframes blink{
  0%,100%{box-shadow:0 0 0 0 rgba(244,168,46,.4)}
  50%{box-shadow:0 0 0 8px rgba(244,168,46,0)}
}
.card.late{border-color:var(--red)}
.card.st-accepted{border-left:4px solid var(--blue)}
.card.st-ready{border-left:4px solid var(--amber-bg)}
.card.st-out{border-left:4px solid var(--blue)}
.card.st-completed{border-left:4px solid var(--green)}
.card.st-cancelled{border-left:4px solid var(--muted-2)}
.card.done{background:#FBFCFE}
.card.done .ref{color:var(--muted)}

.card-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.card.st-accepted .card-head,
.card.st-ready .card-head,
.card.st-out .card-head{padding-right:26px}
.ref{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:-.02em}
.when{color:var(--muted);font-size:12px;font-weight:500;margin-left:auto}

/* Pills */
.pill{
  display:inline-block;font-size:10.5px;font-weight:700;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;letter-spacing:.04em;
}
.pill.collection{background:var(--green-tint);color:var(--green)}
.pill.delivery{background:var(--blue-tint);color:var(--blue)}
.pill.cash{background:var(--amber-tint);color:var(--amber)}
.pill.scheduled{background:#F0E8DA;color:#6B5410}
.pill.s-new{background:var(--amber-tint);color:var(--amber)}
.pill.s-accepted{background:var(--blue-tint);color:var(--blue)}
.pill.s-ready{background:#FFF1A8;color:#6B5410}
.pill.s-out{background:var(--blue-tint);color:var(--blue)}
.pill.s-completed{background:var(--green-tint);color:var(--green)}
.pill.s-cancelled{background:var(--red-tint);color:var(--red)}

/* Collapsible (Recent / Z report) */
.card.collapsible{align-self:start}
.chead{cursor:pointer}
.chead-top{display:flex;align-items:center;gap:8px}
.chead-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.card.collapsible .chev{color:var(--muted-2);font-size:12px;transition:transform .12s;display:inline-block}
.card.collapsible.open .chev{transform:rotate(90deg)}
.head-total{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:500}
.head-date{color:var(--muted);font-size:12px}
.card-body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card-body[hidden]{display:none}

/* Lines */
.lines{
  list-style:none;padding:0;margin:4px 0 0;
  border-top:1px dashed var(--line);padding-top:10px;
}
.lines li{display:flex;gap:8px;padding:3px 0;align-items:baseline;line-height:1.35;font-size:13.5px}
.lines .qty{font-family:var(--mono);font-size:13.5px;color:var(--blue);min-width:28px;font-weight:500}
.lines .name{flex:1;font-weight:600}
.lines .mod{color:var(--muted);font-size:12px;font-weight:500}

/* Totals */
.totals{
  border-top:1px dashed var(--line);padding-top:10px;
  font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;
}
.totals .total{
  color:var(--ink);font-weight:700;font-size:14px;
  margin-top:4px;padding-top:8px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;
}
.totals .total span:last-child{font-family:var(--mono);font-size:16px;font-weight:500}

/* Customer block */
.who{
  background:var(--blue-tint-2);border:1px solid #D9E8FB;
  border-radius:12px;padding:10px 12px;font-size:13px;
}
.who strong{display:block;font-weight:700}
.who a{color:var(--blue);text-decoration:none;font-weight:600}

/* Actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions button{
  flex:1;border-radius:11px;padding:11px 8px;
  font-weight:700;font-size:13.5px;min-height:44px;border:0;
  transition:.15s;letter-spacing:-.01em;
}
.btn-accept{
  background:linear-gradient(135deg,#0A86FF,#0070F0);color:#fff;
  box-shadow:0 6px 14px rgba(0,112,240,.3);
}
.btn-accept:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,112,240,.36)}
.btn-ready{background:var(--amber-bg);color:#fff}
.btn-out{background:var(--blue);color:#fff}
.btn-complete{background:var(--green);color:#fff}
.btn-print{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line) !important}
.btn-print:hover{border-color:var(--blue) !important;color:var(--blue)}
.btn-cancel{
  background:transparent;color:var(--red);
  border:1.5px solid var(--red) !important;flex:0 0 auto !important;
}
.btn-refund{
  background:var(--panel);color:var(--blue);
  border:1.5px solid var(--blue) !important;
}
.btn-refund:hover{background:var(--blue-tint-2)}

/* ⋮ menu */
.card-menu{position:absolute;top:10px;right:10px;z-index:6}
.card-menu .dots{
  background:transparent;border:0;color:var(--muted);
  font-size:18px;line-height:1;padding:4px 8px;border-radius:8px;
}
.card-menu .dots:hover{background:var(--canvas);color:var(--ink)}
.card-menu .menu{
  position:absolute;top:100%;right:0;margin-top:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh-lg);padding:4px;min-width:180px;
}
.card-menu .menu[hidden]{display:none}
.card-menu .menu button{
  display:block;width:100%;text-align:left;background:transparent;
  border:0;padding:11px 14px;border-radius:8px;font-weight:600;
  font-size:13.5px;color:var(--red);
}
.card-menu .menu button:hover{background:var(--red-tint)}
.card-menu .menu .menu-refund{color:var(--ink)}
.card-menu .menu .menu-refund:hover{background:var(--blue-tint-2);color:var(--blue)}

/* Modal overlay */
.ovl{
  position:fixed;inset:0;background:rgba(11,26,46,.5);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:50;padding:24px;
}
.ovl.open{display:grid;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{
  background:var(--panel);border-radius:22px;padding:24px;
  max-width:420px;width:100%;box-shadow:var(--sh-lg);
  animation:modalIn .3s cubic-bezier(.16,1,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.prep-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-bottom:14px;
}
.prep-grid button{
  padding:14px 4px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);font-weight:700;font-size:14px;transition:.12s;box-shadow:var(--sh-sm);
}
.prep-grid button:hover{border-color:var(--blue);color:var(--blue)}
.prep-grid button.active{
  background:var(--blue);color:#fff;border-color:var(--blue);
  box-shadow:0 6px 14px rgba(0,112,240,.3);
}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:14px}
.modal .cancel{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line) !important}
.modal .confirm{
  background:linear-gradient(135deg,#0E9F6E,#0B8A5E);color:#fff;
  box-shadow:0 8px 20px rgba(14,159,110,.3);
}
.modal .confirm:disabled{background:#C7D4E3;box-shadow:none;cursor:not-allowed}

/* New-order alarm */
.ovl.alarm{background:rgba(40,0,0,.55);z-index:60}
.ovl.alarm .modal{
  border:0;max-width:440px;
  animation:alarmpulse 1.1s ease-in-out infinite, modalIn .3s cubic-bezier(.16,1,.3,1);
}
@keyframes alarmpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(224,70,75,.55), var(--sh-lg)}
  50%{box-shadow:0 0 0 14px rgba(224,70,75,0), var(--sh-lg)}
}
.alarm-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.alarm-head h2{color:var(--red);font-size:18px;margin:0}
.alarm-head .ref{font-size:18px}
.alarm-queue{
  margin-left:auto;background:var(--red);color:#fff;
  border-radius:999px;padding:4px 11px;font-weight:700;font-size:11.5px;white-space:nowrap;
}
.alarm-body{max-height:42vh;overflow-y:auto;margin-bottom:14px}
.alarm-body .lines{border-top:0;padding-top:0}
.alarm-prep-label{text-align:center;color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.alarm-actions{display:flex;gap:8px}
.alarm-actions button{
  flex:1;border-radius:13px;padding:16px;
  font-weight:800;font-size:15px;min-height:56px;border:0;
}
.alarm-actions .reject{
  background:var(--panel);color:var(--red);
  border:1.5px solid var(--red) !important;flex:0 0 38%;
}
.alarm-actions .accept{
  background:linear-gradient(135deg,#0E9F6E,#0B8A5E);color:#fff;
  box-shadow:0 8px 20px rgba(14,159,110,.3);
}

/* Refund modal */
.refund-sum{color:var(--muted);font-size:13px;margin-bottom:12px}
.refund-modes{display:flex;gap:8px;margin-bottom:12px}
.refund-modes .rmode{
  flex:1;padding:13px 8px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);font-weight:700;font-size:13px;box-shadow:var(--sh-sm);transition:.12s;
}
.refund-modes .rmode:hover{border-color:var(--blue);color:var(--blue)}
.refund-modes .rmode.active{
  background:var(--blue);color:#fff;border-color:var(--blue);
  box-shadow:0 6px 14px rgba(0,112,240,.3);
}
.refund-items{max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.refund-items[hidden]{display:none}
.refund-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.12s;background:var(--panel);
}
.refund-item:hover{border-color:var(--blue);background:var(--blue-tint-2)}
.refund-item input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--blue)}
.refund-item span{flex:1;font-size:13.5px;font-weight:500}
.refund-item b{font-weight:700;font-family:var(--mono)}

/* Summary view */
.summary{
  grid-column:1/-1;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;align-content:start;
}
.summary .hero{
  grid-column:1/-1;background:linear-gradient(165deg,#0B1A2E,#11283F);
  color:#fff;border-radius:22px;padding:22px 26px;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;box-shadow:var(--sh);
}
.summary .hero .big{
  font-family:var(--mono);font-size:46px;font-weight:500;
  color:#fff;letter-spacing:-.03em;line-height:1;
}
.summary .hero .label{font-size:14px;opacity:.85}
.summary .hero .date{margin-left:auto;font-size:13px;opacity:.7}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh-sm);
}
.stat .v{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1}
.stat .k{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.stat.split{display:flex;flex-direction:column;gap:8px;justify-content:center}
.stat.split .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.stat.split .row span{color:var(--muted);font-weight:500}
.stat.split .row b{font-size:15px;font-family:var(--mono);font-weight:500}

/* Z report */
.zreport{grid-column:1/-1}
.zhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.zt{font-size:20px;font-weight:800;letter-spacing:-.025em}
.zsub{color:var(--muted);font-size:13px;font-weight:500}
.zprintbtn{
  margin-left:auto;background:var(--ink);color:#fff;
  border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:13.5px;
}
.zprintbtn:hover{background:#11283F}
.zfig{
  background:linear-gradient(165deg,#0B1A2E,#11283F);color:#fff;
  border-radius:22px;padding:22px 26px;margin-bottom:14px;
  display:flex;gap:22px;flex-wrap:wrap;align-items:center;box-shadow:var(--sh);
}
.zbig{
  font-family:var(--mono);font-size:46px;font-weight:500;
  color:#fff;line-height:1;display:flex;flex-direction:column;letter-spacing:-.03em;
}
.zbig span{
  font-family:var(--sans);font-size:13px;opacity:.8;
  font-weight:500;letter-spacing:0;margin-top:4px;
}
.zg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px;flex:1}
.zg div{display:flex;flex-direction:column;gap:4px}
.zg b{font-size:17px;font-family:var(--mono);color:#fff;font-weight:500}
.zg span{color:rgba(255,255,255,.65);font-size:11.5px;font-weight:500}
.zorders{
  grid-column:1/-1;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;align-items:start;
}

/* Print */
@media print{
  .rail,.topbar,.datebar,.actions,.ovl,.pin-screen,
  .zprintbtn,.zorders,#refreshBtn{display:none !important}
  body{background:#fff;color:#000}
  #dash{display:block;height:auto}
  .stage{display:block;overflow:visible}
  .grid{display:block;padding:0}
  .card{page-break-after:always;box-shadow:none;border:1.5px solid #000;max-width:76mm}
  .zreport{color:#000}
  .zfig{background:#fff !important;color:#000 !important;border:1.5px solid #000}
  .zbig,.zg b{color:#000}
  .zg span{color:#555}
}

/* Reduce motion */
@media (prefers-reduced-motion:reduce){
  .card.new,.pulse,.ovl.alarm .modal,.tab{animation:none !important}
}

/* Small screens — collapse rail to horizontal top strip */
@media (max-width:720px){
  #dash{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  .rail{flex-direction:row;padding:8px 12px;height:60px;gap:8px;align-items:center}
  .rail::after{display:none}
  .rail .brand{width:38px;height:38px;margin-bottom:0;padding:4px}
  .tabs{
    flex-direction:row;flex:1;gap:4px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    align-items:center;height:100%;justify-content:flex-start;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{width:auto;height:44px;padding:0 12px;flex:0 0 auto;flex-direction:row;gap:6px;font-size:12.5px;border-radius:11px}
  .tab svg{width:18px;height:18px}
  .tab.active::before{display:none}
  .rail-foot{flex-direction:row;padding-top:0;gap:6px}
  .rail-divider{display:none}
  .avatar-btn{width:38px;height:38px}
  .topbar{padding:10px 14px 6px;gap:8px;flex-wrap:wrap}
  .topbar .loc .name{font-size:15px}
  .topbar .loc .sub{font-size:11.5px}
  .topbar .chip{height:34px;padding:0 10px;font-size:12px}
  .topbar button:not(.chip){height:34px;padding:0 10px;font-size:12px}
  .datebar{padding:6px 14px 10px;gap:6px}
  .datebar .dbspacer{display:none}
  .grid{grid-template-columns:1fr;gap:10px;padding:4px 14px 16px}
  .ovl{padding:12px}
  .modal,.ovl.alarm .modal{max-width:100%}
  .zfig{gap:14px;padding:18px}
  .zbig{font-size:36px}
  .summary .hero{padding:18px}
  .summary .hero .big{font-size:36px}
}
</style>
</head>
<body>
<!-- ============================== PIN gate -->
<section id="pinScreen" class="pin-screen">
  <form id="pinForm" class="pin-card" autocomplete="off">
    <h1>{{shopShortName}} — staff orders</h1>
    <div class="sub">Enter the staff PIN to continue</div>
    <input type="number" inputmode="numeric" pattern="[0-9]*" class="pin-input"
           id="pinInput" maxlength="8" placeholder="••••" autofocus required />
    <div class="pin-error" id="pinError" aria-live="polite"></div>
    <button class="pin-btn" type="submit" id="pinSubmit">Unlock</button>
  </form>
</section>

<!-- ============================== Dashboard -->
<div id="dash" hidden>
  <aside class="rail">
    <div class="brand" title="{{shopShortName}}">
      <img src="/logo.png" alt="{{shopShortName}}" />
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="live" role="tab" title="Live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M3 9h18M7 21h10"/></svg>
        <span>Live <span class="tab-count" id="liveCount">0</span></span>
      </button>
      <button class="tab" data-view="done" role="tab" title="Recent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Recent</span>
      </button>
      <button class="tab" data-view="summary" role="tab" title="Summary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18M8 15l3-4 3 2 4-6"/></svg>
        <span>Summary</span>
      </button>
      <button class="tab" data-view="zreport" role="tab" title="Z report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5h6M9 5a2 2 0 10-4 0M9 5H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2h-4M9 5a2 2 0 104 0M8 12h8M8 16h5"/></svg>
        <span>Z report</span>
      </button>
    </nav>
    <div class="rail-foot">
      <div class="rail-divider"></div>
      <button id="logoutBtn" class="avatar-btn" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <section class="stage">
    <div class="topbar">
      <div class="loc">
        <div class="name">{{shopShortName}}</div>
        <div class="sub">Staff dashboard</div>
      </div>
      <div class="top-spacer"></div>
      <div class="chip live"><span class="pulse" id="pulse" title="Live — refreshes automatically"></span> Live</div>
      <button id="refreshBtn" title="Refresh now" aria-label="Refresh">↻</button>
      <button id="soundToggle" title="Toggle sound">🔔 On</button>
    </div>

    <div class="datebar" id="dateBar" hidden>
      <button data-preset="today">Today</button>
      <button data-preset="yesterday">Yesterday</button>
      <button data-preset="7d">Last 7 days</button>
      <button data-preset="thisweek">This week</button>
      <button data-preset="lastweek">Last week</button>
      <span class="dbspacer"></span>
      <label>From <input type="date" id="dateFrom" /></label>
      <label>To <input type="date" id="dateTo" /></label>
      <button id="dateApply" class="dbapply">View</button>
    </div>

    <main class="grid" id="grid">
      <div class="empty">No active orders. Sit tight — they'll appear here as they come in.</div>
    </main>
  </section>
</div>

<!-- ============================== Accept modal -->
<div class="ovl" id="acceptOvl" role="dialog" aria-modal="true" aria-labelledby="acceptTitle">
  <div class="modal">
    <h2 id="acceptTitle">Ready in how long?</h2>
    <div class="prep-grid" id="prepGrid">
      <button data-min="15">15</button>
      <button data-min="20">20</button>
      <button data-min="25" class="active">25</button>
      <button data-min="30">30</button>
      <button data-min="35">35</button>
      <button data-min="40">40</button>
      <button data-min="45">45</button>
      <button data-min="60">60</button>
    </div>
    <div style="text-align:center;margin:-6px 0 14px;color:var(--grey);font-size:0.9rem">
      mins from now
    </div>
    <div class="row">
      <button class="cancel" id="acceptCancel">Cancel</button>
      <button class="confirm" id="acceptConfirm">Accept</button>
    </div>
  </div>
</div>

<!-- ============================== New-order alarm popup -->
<div class="ovl alarm" id="alarmOvl" role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle">
  <div class="modal">
    <div class="alarm-head">
      <h2 id="alarmTitle">🔔 New order</h2>
      <span class="ref" id="alarmRef"></span>
      <span class="alarm-queue" id="alarmQueue">new</span>
    </div>
    <div class="alarm-body" id="alarmBody"></div>
    <div class="prep-grid" id="alarmPrep">
      <button data-min="15">15</button>
      <button data-min="20">20</button>
      <button data-min="25" class="active">25</button>
      <button data-min="30">30</button>
      <button data-min="35">35</button>
      <button data-min="40">40</button>
      <button data-min="45">45</button>
      <button data-min="60">60</button>
    </div>
    <div class="alarm-prep-label">ready in (mins) — pick before accepting</div>
    <div class="alarm-actions">
      <button class="reject" id="alarmReject">Reject</button>
      <button class="accept" id="alarmAccept">Accept</button>
    </div>
  </div>
</div>

<!-- ============================== Refund modal -->
<div class="ovl" id="refundOvl" role="dialog" aria-modal="true" aria-labelledby="refundTitle">
  <div class="modal">
    <h2 id="refundTitle">Refund order</h2>
    <div id="refundBody"></div>
    <div class="row">
      <button class="cancel" id="refundCancel">Close</button>
      <button class="confirm" id="refundConfirm">Refund</button>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* ============================== Beep generator (no asset needed) */
const audio = (() => {
  let ctx = null;
  const ensure = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Browsers suspend the context (autoplay policy, or when the tab was
    // backgrounded); resume so the chime actually plays.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  };
  function tone(freq, ms, when = 0, vol = 0.3) {
    const c = ensure();
    const o = c.createOscillator();
    const g = c.createGain();
    o.frequency.value = freq;
    o.type = 'sine';
    o.connect(g).connect(c.destination);
    g.gain.setValueAtTime(0, c.currentTime + when);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + when + 0.02);
    g.gain.linearRampToValueAtTime(0, c.currentTime + when + ms / 1000);
    o.start(c.currentTime + when);
    o.stop(c.currentTime + when + ms / 1000 + 0.05);
  }
  return {
    chime() {
      tone(880, 180, 0);
      tone(1320, 220, 0.18);
      tone(880, 180, 0.42);
    },
    unlock() { try { ensure(); } catch {} },
  };
})();

// Any tap/click/key on the device resumes a suspended AudioContext, so the
// new-order chime reliably rings even if the page was opened without a gesture
// (e.g. an existing session) or the tab had been backgrounded.
['pointerdown', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => audio.unlock(), { capture: true }));

// Close any open card ⋮ menu when clicking elsewhere.
document.addEventListener('click', (e) => {
  if (!e.target.closest('.card-menu')) {
    $$('.card-menu .menu').forEach(m => m.setAttribute('hidden', ''));
  }
});

/* ============================== State */
const state = {
  authed: false,
  orders: [],
  seenIds: new Set(),
  soundOn: localStorage.getItem('ricos-sound') !== 'off',
  pollHandle: null,
  lastPollAt: 0,
  alarmHandle: null,   // setInterval for the repeating new-order chime
  alarmId: null,       // order id currently shown in the alarm popup
  alarmMin: 25,        // prep minutes selected in the alarm popup
  view: 'live',        // live | done (Recent) | summary | zreport
  doneOrders: [],      // cache for the Recent view
  from: '',            // selected London-day range (Recent + Z report)
  to: '',
};

function setSoundLabel() {
  $('#soundToggle').textContent = state.soundOn ? '🔔 On' : '🔕 Off';
}
setSoundLabel();
$('#soundToggle').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  localStorage.setItem('ricos-sound', state.soundOn ? 'on' : 'off');
  setSoundLabel();
  if (state.soundOn) audio.chime(); // unlock audio context
});

/* ============================== Date range (London calendar days) */
function ymdToday() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' }); }
function ymdShift(ymd, days) {
  const d = new Date(ymd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function ymdDowMon0(ymd) { return (new Date(ymd + 'T00:00:00Z').getUTCDay() + 6) % 7; } // 0=Mon..6=Sun
function presetRange(preset) {
  const today = ymdToday();
  if (preset === 'yesterday') { const y = ymdShift(today, -1); return { from: y, to: y }; }
  if (preset === '7d') return { from: ymdShift(today, -6), to: today };
  if (preset === 'thisweek') return { from: ymdShift(today, -ymdDowMon0(today)), to: today };
  if (preset === 'lastweek') {
    const wkStart = ymdShift(today, -ymdDowMon0(today));
    return { from: ymdShift(wkStart, -7), to: ymdShift(wkStart, -1) };
  }
  return { from: today, to: today };
}
function applyRangeToInputs() {
  $('#dateFrom').value = state.from;
  $('#dateTo').value = state.to;
}
function reloadRangeView() {
  if (state.view === 'done') loadDone();
  else if (state.view === 'zreport') loadReport(false);
}

/* ============================== View tabs */
function setView(view) {
  state.view = view;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  const usesRange = (view === 'done' || view === 'zreport');
  $('#dateBar').hidden = !usesRange;
  if (usesRange) applyRangeToInputs();
  if (view === 'done') loadDone();
  else if (view === 'summary') loadSummary(false);
  else if (view === 'zreport') loadReport(false);
  else renderList(state.orders);
}
$$('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
$('#refreshBtn').addEventListener('click', () => {
  $('#refreshBtn').classList.add('spin');
  setTimeout(() => $('#refreshBtn').classList.remove('spin'), 500);
  if (state.view === 'done') loadDone();
  else if (state.view === 'summary') loadSummary(false);
  else if (state.view === 'zreport') loadReport(false);
  else poll();
});
$$('#dateBar [data-preset]').forEach(b => b.addEventListener('click', () => {
  const r = presetRange(b.dataset.preset);
  state.from = r.from; state.to = r.to;
  applyRangeToInputs();
  reloadRangeView();
}));
$('#dateApply').addEventListener('click', () => {
  const f = $('#dateFrom').value, t = $('#dateTo').value;
  if (!f || !t) return;
  state.from = f <= t ? f : t;
  state.to = f <= t ? t : f;
  applyRangeToInputs();
  reloadRangeView();
});

/* ============================== Auth */
$('#pinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#pinError').textContent = '';
  $('#pinSubmit').disabled = true;
  try {
    const pin = $('#pinInput').value.trim();
    const res = await fetch('/api/staff/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      $('#pinError').textContent = j.error || `Error ${res.status}`;
      return;
    }
    enterDashboard();
  } catch (err) {
    $('#pinError').textContent = 'Network error — try again.';
  } finally {
    $('#pinSubmit').disabled = false;
  }
});

$('#logoutBtn').addEventListener('click', () => {
  document.cookie = 'rs=; Max-Age=0; Path=/; Secure; SameSite=Lax';
  if (state.pollHandle) clearInterval(state.pollHandle);
  stopAlarm();
  $('#alarmOvl').classList.remove('open');
  state.alarmId = null;
  $('#dash').hidden = true;
  $('#pinScreen').style.display = 'grid';
  $('#pinInput').value = '';
  $('#pinInput').focus();
});

function enterDashboard() {
  state.authed = true;
  if (!state.from) { state.from = state.to = ymdToday(); }
  $('#pinScreen').style.display = 'none';
  $('#dash').hidden = false;
  // Prime the audio context with a silent tone so iOS lets us play later.
  if (state.soundOn) {
    try { audio.chime(); } catch {}
  }
  poll();
  state.pollHandle = setInterval(poll, 5000);
}

/* ============================== Poll + render */
async function poll() {
  try {
    const res = await fetch('/api/staff/orders', { cache: 'no-store' });
    if (res.status === 401) {
      // Session expired.
      $('#logoutBtn').click();
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.lastPollAt = Date.now();
    state.pollTick = (state.pollTick || 0) + 1;
    $('#pulse').classList.remove('stale');
    handleOrders(data.orders || []);
    // Refresh the Summary figures periodically (~30s), not on every 5s poll —
    // it does a date-range scan, so we keep it off the live cadence.
    if (state.view === 'summary' && state.pollTick % 6 === 0) loadSummary(true);
  } catch (e) {
    console.error('poll failed', e);
    $('#pulse').classList.add('stale');
  }
}

function handleOrders(orders) {
  const newIds = orders
    .filter(o => o.status === 'pending_accept' && !state.seenIds.has(o.id))
    .map(o => o.id);
  for (const o of orders) state.seenIds.add(o.id);

  state.orders = orders;
  $('#liveCount').textContent = orders.length;
  // Only repaint the grid when the Live tab is showing; the Recent tab keeps
  // its own list. Polling continues in the background so the alarm still fires
  // even while staff are looking at history.
  if (state.view === 'live') renderList(orders, newIds);
  // The repeating alarm + popup are driven entirely by whether any orders are
  // still waiting to be accepted — that set IS the queue.
  syncAlarm();
}

function renderList(list, newIds = []) {
  const grid = $('#grid');
  if (!list || list.length === 0) {
    grid.innerHTML = state.view === 'done'
      ? '<div class="empty">No completed or cancelled orders for the selected dates. Use the date bar above to pick another day or range.</div>'
      : '<div class="empty">No active orders. Sit tight — they\'ll appear here as they come in.</div>';
    return;
  }
  const collapsed = state.view === 'done';
  grid.innerHTML = list.map(o => renderCard(o, newIds.includes(o.id), collapsed)).join('');
  wireCardButtons();
}

function wireCardButtons() {
  $$('.card .btn-accept').forEach(b => b.addEventListener('click', () => openAccept(b.dataset.id)));
  $$('.card .btn-ready').forEach(b => b.addEventListener('click', () => updateStatus(b.dataset.id, 'ready')));
  $$('.card .btn-out').forEach(b => b.addEventListener('click', () => updateStatus(b.dataset.id, 'out_for_delivery')));
  $$('.card .btn-complete').forEach(b => b.addEventListener('click', () => updateStatus(b.dataset.id, 'completed')));
  $$('.card .btn-cancel').forEach(b => b.addEventListener('click', () => {
    if (confirm('Cancel this order? The customer is notified and any card payment is refunded automatically.')) {
      updateStatus(b.dataset.id, 'cancelled');
    }
  }));
  $$('.card .btn-print').forEach(b => b.addEventListener('click', () => printOrder(b.dataset.id)));
  // ⋮ menu on accepted cards: toggle open, and cancel (auto-refunds card orders).
  $$('.card-menu .dots').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const menu = b.parentElement.querySelector('.menu');
    const open = menu.hasAttribute('hidden');
    $$('.card-menu .menu').forEach(m => m.setAttribute('hidden', ''));
    if (open) menu.removeAttribute('hidden');
  }));
  $$('.card-menu .menu-cancel').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (confirm('Cancel this order? The customer is notified and any card payment is refunded automatically.')) {
      updateStatus(b.dataset.id, 'cancelled');
    }
  }));
  $$('.card-menu .menu-refund, .card .btn-refund').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    openRefund(b.dataset.id);
  }));
  // Expand/collapse Recent cards by tapping their header (ignore button/link taps).
  $$('.card.collapsible').forEach(card => {
    const head = card.querySelector('.chead');
    head.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      const body = card.querySelector('.card-body');
      if (!body) return;
      const willOpen = body.hasAttribute('hidden');
      body.toggleAttribute('hidden', !willOpen);
      card.classList.toggle('open', willOpen);
    });
  });
}

async function loadDone() {
  const grid = $('#grid');
  grid.innerHTML = '<div class="empty">Loading orders…</div>';
  try {
    const res = await fetch(`/api/staff/orders?view=done&from=${state.from}&to=${state.to}`, { cache: 'no-store' });
    if (res.status === 401) { $('#logoutBtn').click(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.doneOrders = data.orders || [];
  } catch (e) {
    grid.innerHTML = '<div class="empty">Couldn\'t load orders. Tap ↻ to retry.</div>';
    return;
  }
  if (state.view === 'done') renderList(state.doneOrders);
}

async function loadSummary(silent) {

    if (!silent) grid.innerHTML = '<div class="empty">Couldn\'t load the summary. Tap ↻ to retry.</div>';

async function loadReport(silent) {
  const grid = $('#grid');
  if (!silent) grid.innerHTML = '<div class="empty">Loading report…</div>';

  try {
    const res = await fetch(`/api/staff/summary?from=${state.from}&to=${state.to}`, { cache: 'no-store' });

function renderCard(o, isNew, collapsed = false, readOnly = false) {
  const cls = ['card'];
  if (isNew) cls.push('new');
  if (isLate(o)) cls.push('late');
  const stClass = { accepted: 'st-accepted', ready: 'st-ready', out_for_delivery: 'st-out', completed: 'st-completed', cancelled: 'st-cancelled' };
  if (stClass[o.status]) cls.push(stClass[o.status]);
  if (o.status === 'completed' || o.status === 'cancelled') cls.push('done');
  if (collapsed) cls.push('collapsible');

  const placedAgo = humanAgo(new Date(o.createdAt));
  const stLabel = { pending_accept: 'new', accepted: 'accepted', ready: 'ready', out_for_delivery: 'out for delivery', completed: 'completed', cancelled: 'cancelled' };
  const stPillCls = { pending_accept: 's-new', accepted: 's-accepted', ready: 's-ready', out_for_delivery: 's-out', completed: 's-completed', cancelled: 's-cancelled' };
  const statusPill = stLabel[o.status]
    ? `<span class="pill ${stPillCls[o.status]}">${stLabel[o.status]}</span>`
    : '';
  const pmt = o.payment || {};
  const refundedP = pmt.refundedTotalP
    || (pmt.refund?.state === 'succeeded' ? pmt.refund.amountP : 0) || 0;
  const fullyRefunded = refundedP >= (o.totals.totalP || 0);
  // Card orders that took payment can still be refunded (full or partial) until
  // fully refunded — including completed ones.
  const canRefund = o.paymentMethod === 'card'
    && ['paid', 'partly_refunded', 'refunded'].includes(pmt.state)
    && !fullyRefunded;
  const refundPill = refundedP > 0
    ? (fullyRefunded
        ? '<span class="pill s-completed">refunded</span>'
        : `<span class="pill s-cancelled">part-refund £${(refundedP / 100).toFixed(2)}</span>`)
    : (pmt.refundFailed ? '<span class="pill s-cancelled">refund: manual</span>' : '');
  const fulfillmentPill = o.fulfillment === 'delivery'
    ? '<span class="pill delivery">delivery</span>'
    : '<span class="pill collection">collection</span>';
  const cashPill = o.paymentMethod !== 'card'
    ? `<span class="pill cash">${o.paymentMethod === 'cash_collection' ? 'cash on collect' : 'cash on delivery'}</span>`
    : '';
  const schedPill = o.schedule && o.schedule !== 'asap'
    ? `<span class="pill scheduled">${formatTime(o.schedule)}</span>`
    : '';

  const lines = lineItemsHtml(o);

  const addr = o.address ? `<div style="font-size:0.85rem;color:var(--grey);margin-top:4px">${escapeHtml(o.address.line1)}${o.address.line2 ? ', ' + escapeHtml(o.address.line2) : ''}, ${escapeHtml(o.address.postcode)}${o.address.notes ? `<br><em>${escapeHtml(o.address.notes)}</em>` : ''}</div>` : '';

  const totals = `
    <div class="totals">
      <div>${o.totals.lines.length} items · subtotal £${(o.totals.subtotalP/100).toFixed(2)}</div>
      ${o.totals.discountP ? `<div>${escapeHtml(o.totals.discountLabel || 'Discount')}: −£${(o.totals.discountP/100).toFixed(2)}</div>` : ''}
      ${o.totals.deliveryFeeP ? `<div>Delivery: £${(o.totals.deliveryFeeP/100).toFixed(2)}</div>` : ''}
      <div class="total"><span>Total</span><span>£${(o.totals.totalP/100).toFixed(2)}</span></div>
    </div>`;

  let actions = '';
  if (o.status === 'pending_accept') {
    actions = `
      <button class="btn-accept" data-id="${o.id}">Accept →</button>
      <button class="btn-print" data-id="${o.id}">Print</button>
      <button class="btn-cancel" data-id="${o.id}">Cancel</button>`;
  } else if (o.status === 'accepted') {
    const verb = o.fulfillment === 'delivery' ? '→ Out' : '→ Ready';
    const cls = o.fulfillment === 'delivery' ? 'btn-out' : 'btn-ready';
    const status = o.fulfillment === 'delivery' ? 'out_for_delivery' : 'ready';
    actions = `
      <button class="${cls}" data-id="${o.id}" data-status="${status}">${verb}</button>
      <button class="btn-print" data-id="${o.id}">Print</button>`;
  } else if (o.status === 'ready' || o.status === 'out_for_delivery') {
    actions = `
      <button class="btn-complete" data-id="${o.id}">→ Complete</button>
      <button class="btn-print" data-id="${o.id}">Print</button>`;
  } else if (o.status === 'completed' || o.status === 'cancelled') {
    actions = `<button class="btn-print" data-id="${o.id}">Print</button>`
      + (o.status === 'completed' && canRefund ? `<button class="btn-refund" data-id="${o.id}">Refund…</button>` : '');
  }
  if (readOnly) actions = '';   // Z report cards are view-only

  const dateLabel = formatDate(o.createdAt);
  const ready = o.readyAt
    ? `<div class="when">${dateLabel} · ready ${formatTime(o.readyAt)}</div>`
    : `<div class="when">${dateLabel} · ${placedAgo}</div>`;

  const detail = `
      <ul class="lines">${lines}</ul>
      <div class="who">
        <strong>${escapeHtml(o.customer.name)}</strong>
        <a href="tel:${escapeHtml(o.customer.phone)}">${escapeHtml(o.customer.phone)}</a>
        ${addr}
      </div>
      ${totals}
      <div class="actions">${actions}</div>`;

  // ⋮ menu on in-progress cards: Refund… (full/partial) for paid card orders,
  // plus Cancel & refund on accepted (cancels + full refund via the reject path).
  const menuItems = [];
  if (canRefund && ['accepted', 'ready', 'out_for_delivery'].includes(o.status)) {
    menuItems.push(`<button class="menu-refund" data-id="${o.id}">Refund…</button>`);
  }
  if (o.status === 'accepted') {
    menuItems.push(`<button class="menu-cancel" data-id="${o.id}">${o.paymentMethod === 'card' ? 'Cancel &amp; refund' : 'Cancel order'}</button>`);
  }
  const menuHtml = menuItems.length
    ? `<div class="card-menu">
         <button class="dots" data-id="${o.id}" aria-label="More actions">⋮</button>
         <div class="menu" hidden>${menuItems.join('')}</div>
       </div>`
    : '';

  // Recent cards start collapsed: just ref + status + total. Tapping the header
  // expands the full order. Live cards always show everything (the kitchen
  // needs it at a glance).
  if (collapsed) {
    return `
    <article class="${cls.join(' ')}">
      <div class="chead">
        <div class="chead-top">
          <span class="chev">▸</span>
          <span class="ref">#${escapeHtml(o.id)}</span>
          <span class="head-total">£${(o.totals.totalP/100).toFixed(2)}</span>
        </div>
        <div class="chead-sub">
          <span class="head-date">${dateLabel}</span>
          ${statusPill}
          ${refundPill}
        </div>
      </div>
      <div class="card-body" hidden>
        <div class="card-head">${fulfillmentPill}${cashPill}${schedPill}${ready}</div>
        ${detail}
      </div>
    </article>`;
  }

  return `
    <article class="${cls.join(' ')}">
      ${menuHtml}
      <div class="card-head">
        <span class="ref">#${escapeHtml(o.id)}</span>
        ${statusPill}
        ${refundPill}
        ${fulfillmentPill}
        ${cashPill}
        ${schedPill}
        ${ready}
      </div>
      ${detail}
    </article>`;
}

function isLate(o) {
  if (!o.readyAt) return false;
  return Date.now() > new Date(o.readyAt).getTime() + 5 * 60000;
}

function humanAgo(d) {
  const sec = Math.round((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return `${sec}s ago`;
  const min = Math.round(sec / 60);
  if (min < 60) return `${min}m ago`;
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' });
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { timeZone: 'Europe/London', day: '2-digit', month: 'short' });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function lineItemsHtml(o) {
  return (o.totals.lines || []).map(l => `
    <li>
      <span class="qty">${l.qty}×</span>
      <span class="name">${escapeHtml(l.name)}${l.spice ? ` <span class="mod" style="background:#ffe1d4;color:#a8331a;font-weight:600">${escapeHtml(l.spice)}</span>` : ''}${l.meal ? ' <span class="mod">(meal)</span>' : ''}${l.mealChoices && l.mealChoices.length ? ` <span class="mod">(${l.mealChoices.map(escapeHtml).join(', ')})</span>` : ''}${l.modifiers && l.modifiers.length ? ` <span class="mod">(${l.modifiers.map(escapeHtml).join(', ')})</span>` : ''}</span>
    </li>`).join('');
}

/* ============================== New-order alarm + queue
   Orders still in 'pending_accept' ARE the queue. While any exist we show a
   demanding popup for the oldest one and repeat the chime until it's accepted
   or rejected; clearing one advances to the next automatically. */
function pendingQueue() {
  // listActiveOrders already returns oldest-first.
  return state.orders.filter(o => o.status === 'pending_accept');
}

function syncAlarm() {
  const q = pendingQueue();
  if (q.length === 0) {
    stopAlarm();
    $('#alarmOvl').classList.remove('open');
    state.alarmId = null;
    return;
  }
  const cur = q[0];
  if (state.alarmId !== cur.id) {
    state.alarmId = cur.id;
    state.alarmMin = 25;
    renderAlarm(cur, q.length);
  } else {
    $('#alarmQueue').textContent = q.length > 1 ? `${q.length} waiting` : 'new';
  }
  $('#alarmOvl').classList.add('open');
  startAlarm();
}

function renderAlarm(o, qlen) {
  $('#alarmRef').textContent = `#${o.id}`;
  $('#alarmQueue').textContent = qlen > 1 ? `${qlen} waiting` : 'new';

  const fulfillment = o.fulfillment === 'delivery' ? 'Delivery' : 'Collection';
  const pay = o.paymentMethod === 'card' ? 'Paid by card'
    : (o.paymentMethod === 'cash_collection' ? 'CASH on collection' : 'CASH on delivery');
  const sched = o.schedule && o.schedule !== 'asap' ? ` · for ${formatTime(o.schedule)}` : ' · ASAP';
  const addr = o.address
    ? `<div style="font-size:0.88rem;color:var(--grey);margin-top:4px">${escapeHtml(o.address.line1)}${o.address.line2 ? ', ' + escapeHtml(o.address.line2) : ''}, ${escapeHtml(o.address.postcode)}${o.address.notes ? `<br><em>${escapeHtml(o.address.notes)}</em>` : ''}</div>`
    : '';

  $('#alarmBody').innerHTML = `
    <div style="font-weight:700;margin-bottom:6px">${fulfillment}${sched} · ${pay}</div>
    <ul class="lines">${lineItemsHtml(o)}</ul>
    <div class="totals">
      <div class="total"><span>Total</span><span>£${(o.totals.totalP/100).toFixed(2)}</span></div>
    </div>
    <div class="who" style="margin-top:10px">
      <strong>${escapeHtml(o.customer.name)}</strong>
      <a href="tel:${escapeHtml(o.customer.phone)}">${escapeHtml(o.customer.phone)}</a>
      ${addr}
    </div>`;

  $$('#alarmPrep button').forEach(x => x.classList.toggle('active', Number(x.dataset.min) === state.alarmMin));
}

function startAlarm() {
  if (state.alarmHandle) return;
  if (state.soundOn) audio.chime();
  state.alarmHandle = setInterval(() => { if (state.soundOn) audio.chime(); }, 2500);
}
function stopAlarm() {
  if (state.alarmHandle) { clearInterval(state.alarmHandle); state.alarmHandle = null; }
}

$$('#alarmPrep button').forEach(b => {
  b.addEventListener('click', () => {
    $$('#alarmPrep button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.alarmMin = Number(b.dataset.min);
  });
});

$('#alarmAccept').addEventListener('click', async () => {
  const id = state.alarmId;
  if (!id) return;
  $('#alarmAccept').disabled = true;
  try {
    await acceptOrder(id, state.alarmMin);
    state.alarmId = null;   // force the next pending order to render fresh
    setView('live');        // land on the live board after accepting
    await poll();           // poll() -> syncAlarm() advances or closes
  } catch (e) {
    alert(e.message || 'Could not accept — try again.');
  } finally {
    $('#alarmAccept').disabled = false;
  }
});

$('#alarmReject').addEventListener('click', async () => {
  const id = state.alarmId;
  if (!id) return;
  if (!confirm('Reject this order? The customer is notified and any card payment is refunded automatically.')) return;
  $('#alarmReject').disabled = true;
  try {
    const r = await sendStatus(id, 'cancelled');
    state.alarmId = null;
    await poll();
    noteRefund(r);
  } catch (e) {
    alert(e.message || 'Could not reject — try again.');
  } finally {
    $('#alarmReject').disabled = false;
  }
});

/* ============================== Accept modal */
let acceptingId = null;
let acceptMin = 25;

$$('#prepGrid button').forEach(b => {
  b.addEventListener('click', () => {
    $$('#prepGrid button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    acceptMin = Number(b.dataset.min);
  });
});
$('#acceptCancel').addEventListener('click', () => closeAccept());
$('#acceptOvl').addEventListener('click', (e) => {
  if (e.target.id === 'acceptOvl') closeAccept();
});
$('#acceptConfirm').addEventListener('click', async () => {
  if (!acceptingId) return;
  $('#acceptConfirm').disabled = true;
  try {
    await acceptOrder(acceptingId, acceptMin);
    closeAccept();
    poll();
  } catch (e) {
    alert(e.message || 'Could not accept — try again.');
  } finally {
    $('#acceptConfirm').disabled = false;
  }
});

async function acceptOrder(id, prepMinutes) {
  const res = await fetch(`/api/staff/orders/${id}/accept`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prepMinutes }),
  });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Error ${res.status}`);
  }
  return res.json();
}

function openAccept(id) {
  acceptingId = id;
  acceptMin = 25;
  $$('#prepGrid button').forEach(x => x.classList.toggle('active', Number(x.dataset.min) === 25));
  $('#acceptOvl').classList.add('open');
}
function closeAccept() {
  acceptingId = null;
  $('#acceptOvl').classList.remove('open');
}

/* ============================== Refund modal (full / partial by item) */
let refundCtx = null;

function findOrder(id) {
  return (state.orders || []).find(o => o.id === id)
    || (state.doneOrders || []).find(o => o.id === id)
    || null;
}

function openRefund(id) {
  const o = findOrder(id);
  if (!o) return;
  $$('.card-menu .menu').forEach(m => m.setAttribute('hidden', ''));
  const total = o.totals.totalP || 0;
  const pmt = o.payment || {};
  const prior = pmt.refundedTotalP || (pmt.refund?.state === 'succeeded' ? pmt.refund.amountP : 0) || 0;
  refundCtx = {
    id, total, prior, remaining: total - prior, mode: 'full', selected: new Set(),
    lines: o.totals.lines || [],
    sub: o.totals.subtotalP || 0,
    disc: o.totals.discountP || 0,
  };
  renderRefund(o);
  $('#refundOvl').classList.add('open');
}

// Each line's exact discounted share of what the customer paid (mirrors the
// server). Per-order fees aren't refunded with individual items.
function lineShareP(i) {
  const c = refundCtx, l = c.lines[i];
  if (!l) return 0;
  return c.sub > 0 ? Math.round((l.lineTotalP || 0) * (c.sub - c.disc) / c.sub) : (l.lineTotalP || 0);
}

function refundAmountP() {
  if (!refundCtx) return 0;
  if (refundCtx.mode === 'full') return refundCtx.remaining;
  let sum = 0;
  refundCtx.selected.forEach(i => { sum += lineShareP(i); });
  return Math.min(sum, refundCtx.remaining);
}

function updateRefundConfirm() {
  const amt = refundAmountP();
  const btn = $('#refundConfirm');
  btn.textContent = `Refund £${(amt / 100).toFixed(2)}`;
  btn.disabled = !(amt > 0);
}

function renderRefund(o) {
  const c = refundCtx;
  const gbp = p => `£${((p || 0) / 100).toFixed(2)}`;
  const priorLine = c.prior > 0 ? ` · already refunded ${gbp(c.prior)} · ${gbp(c.remaining)} left` : '';
  const items = c.lines.map((l, i) => `
    <label class="refund-item">
      <input type="checkbox" data-i="${i}" ${c.selected.has(i) ? 'checked' : ''} />
      <span>${l.qty}× ${escapeHtml(l.name)}</span>
      <b>${gbp(lineShareP(i))}</b>
    </label>`).join('');
  const discNote = c.disc > 0
    ? '<div class="refund-sum" style="margin:-4px 0 8px">Each amount is the item\'s share after the discount.</div>'
    : '';
  $('#refundTitle').textContent = `Refund #${o.id}`;
  $('#refundBody').innerHTML = `
    <div class="refund-sum">${gbp(c.total)} total${priorLine}</div>
    <div class="refund-modes">
      <button class="rmode ${c.mode === 'full' ? 'active' : ''}" data-mode="full">Full refund ${gbp(c.remaining)}</button>
      <button class="rmode ${c.mode === 'partial' ? 'active' : ''}" data-mode="partial">By item</button>
    </div>
    ${c.mode === 'partial' ? discNote : ''}
    <div class="refund-items" ${c.mode === 'partial' ? '' : 'hidden'}>${items || '<div class="muted" style="color:var(--grey)">No itemised lines on this order.</div>'}</div>`;
  $$('#refundBody .rmode').forEach(b => b.addEventListener('click', () => { c.mode = b.dataset.mode; renderRefund(o); }));
  $$('#refundBody .refund-item input').forEach(cb => cb.addEventListener('change', () => {
    const i = Number(cb.dataset.i);
    if (cb.checked) c.selected.add(i); else c.selected.delete(i);
    updateRefundConfirm();
  }));
  updateRefundConfirm();
}

function closeRefund() {
  refundCtx = null;
  $('#refundOvl').classList.remove('open');
}
$('#refundCancel').addEventListener('click', closeRefund);
$('#refundOvl').addEventListener('click', (e) => { if (e.target.id === 'refundOvl') closeRefund(); });

$('#refundConfirm').addEventListener('click', async () => {
  if (!refundCtx) return;
  const c = refundCtx;
  const amt = refundAmountP();
  if (!(amt > 0)) return;
  const full = c.mode === 'full';
  const reason = full ? '' : [...c.selected].map(i => `${c.lines[i].qty}× ${c.lines[i].name}`).join(', ');
  if (!confirm(`Refund £${(amt / 100).toFixed(2)} to the customer's card?`)) return;
  $('#refundConfirm').disabled = true;
  try {
    const res = await fetch(`/api/staff/orders/${c.id}/refund`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(full ? { mode: 'full' } : { mode: 'partial', lineIndexes: [...c.selected], reason }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) { alert(data.error || `Refund failed (${res.status}).`); return; }
    closeRefund();
    if (state.view === 'done') loadDone();
    else if (state.view === 'zreport') loadReport(false);
    else poll();
  } catch (e) {
    alert('Network error — try again.');
  } finally {
    $('#refundConfirm').disabled = false;
  }
});

/* ============================== Status updates */
async function sendStatus(id, status, reason) {
  const res = await fetch(`/api/staff/orders/${id}/status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(reason ? { status, reason } : { status }),
  });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Error ${res.status}`);
  }
  return res.json();
}

// Alert staff only when the automatic refund failed — they must do it by hand.
function noteRefund(result) {
  if (result && result.refund && result.refund.ok === false) {
    alert('Order rejected — but the automatic card refund FAILED.\nPlease refund it manually in Stripe.\n\n' + (result.refund.error || ''));
  }
}

async function updateStatus(id, status) {
  try {
    const r = await sendStatus(id, status);
    poll();
    noteRefund(r);
  } catch (e) {
    alert(e.message || 'Network error — try again.');
  }
}

/* ============================== Print */
function printOrder(id) {
  // Browser print of just the matching card. We add a class that hides others
  // via @media print rules above.
  const card = $$('.card').find(c => c.querySelector(`[data-id="${id}"]`));
  if (!card) { window.print(); return; }
  $$('.card').forEach(c => c.style.display = (c === card ? '' : 'none'));
  window.print();
  setTimeout(() => $$('.card').forEach(c => c.style.display = ''), 250);
}

/* ============================== Auto-detect existing session */
(async () => {
  try {
    const res = await fetch('/api/staff/orders', { cache: 'no-store' });
    if (res.ok) enterDashboard();
  } catch {}
})();
</script>
