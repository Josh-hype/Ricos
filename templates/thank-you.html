<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order received — {{shopName}}</title>
<meta name="description" content="Thanks — your order is in. We'll confirm a ready time shortly." />
<meta name="robots" content="noindex,nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --red: {{themePrimary}};
    --yellow: {{themeAccent}};
    --cream: {{themeBackground}};
    --paper: {{themeSurface}};
    --ink: #181210;
    --green: #1f8a3e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 0 24px 48px -16px rgba(24,18,16,.45);
    padding: 40px 32px;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .tick {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    font-size: 36px;
    line-height: 1;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.8rem;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .ref {
    font-family: 'Anton', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.04em;
    background: var(--yellow);
    display: inline-block;
    padding: 4px 16px;
    border-radius: 8px;
    margin: 12px 0;
  }
  p { margin: 12px 0; line-height: 1.5; }
  .muted { color: #6b5e58; font-size: 0.93rem; }
  .links { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    padding: 12px 22px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: var(--ink);
    color: var(--yellow);
    text-decoration: none;
    font-weight: 700;
  }
  a.btn.secondary { background: transparent; color: var(--ink); }
</style>
</head>
<body>
  <main class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Order received</h1>
    <p>Thanks — your order is in the kitchen's queue.</p>
    <div class="ref" id="ref">—</div>
    <p>We'll email your <strong>order confirmation</strong> with the ready time as soon as the restaurant accepts your order — usually within ~5 minutes.</p>
    <p class="muted">Allergies? Call the restaurant on <a href="tel:{{shopPhoneTel}}" style="color:inherit;font-weight:600">{{shopPhone}}</a> before collecting.</p>
    <div class="links">
      <a class="btn" href="/">Back to home</a>
      <a class="btn secondary" href="/order">Order again</a>
    </div>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const ref = (params.get('ref') || '').toUpperCase();
  if (ref) document.getElementById('ref').textContent = ref;
</script>
</body>
</html>
