<!doctype html>
<!--
  Acomb Pizza & Kebab House — TEMPORARY holding page.

  The finished landing page is preserved beside this one as index.full.html.
  The build only ever reads index.html from a shop folder, so that file ships
  nothing and costs nothing; restoring the real site is a two-line swap:

      git mv index.html      index.holding.html
      git mv index.full.html index.html

  Online ordering is switched off at the same time via the "closures" map in
  config.json ("*" = every day). That is what disables checkout AND makes
  /api/order reject with 503 — without it this page would be a sign on the door
  while the ordering page behind it quietly kept taking cash orders onto a board
  nobody is watching. Remove the closures block when the site comes back.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{shopName}} — new website coming soon</title>
<meta name="description" content="{{shopName}} in {{shopCity}} is having a new website built. Give us a call on {{shopPhone}} in the meantime." />
<link href="{{fontLink}}" rel="stylesheet" />
<style>
  :root {
    --primary: {{themePrimary}};
    --primary-deep: {{themePrimaryDeep}};
    --accent: {{themeAccent}};
    --bg: {{themeBackground}};
    --surface: {{themeSurface}};
    --ink: #1a1614;
    --muted: #6b625c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: {{fontBody}};
    /* A holding page is one short message. Centring it vertically keeps it
       from floating at the top of a tall desktop window looking unfinished. */
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border-radius: 22px;
    padding: 48px 34px 40px;
    box-shadow: 0 18px 50px rgb(0 0 0 / 9%);
  }
  .logo {
    width: min(210px, 62%);
    height: auto;
    margin: 0 auto 26px;
    display: block;
  }
  .badge {
    display: inline-block;
    margin-bottom: 20px;
    padding: 7px 15px;
    border-radius: 999px;
    background: var(--primary);
    color: #fff;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 16px;
    font-family: {{fontDisplay}};
    font-size: clamp(30px, 6.4vw, 44px);
    line-height: 1.1;
    letter-spacing: -.02em;
    color: var(--primary-deep);
  }
  p {
    margin: 0 auto 14px;
    max-width: 42ch;
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
  }
  .call {
    display: inline-block;
    margin-top: 22px;
    padding: 17px 34px;
    border-radius: 14px;
    background: var(--primary);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    letter-spacing: .01em;
  }
  .call:hover { background: var(--primary-deep); }
  .where {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid rgb(0 0 0 / 8%);
    font-size: 15px;
    color: var(--muted);
  }
  .rule {
    width: 54px;
    height: 4px;
    margin: 0 auto 24px;
    border-radius: 4px;
    background: var(--accent);
  }
  @media (max-width: 420px) {
    .card { padding: 36px 22px 30px; border-radius: 18px; }
    .call { display: block; padding: 16px 20px; }
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="{{shopName}}" />
    <div class="badge">Coming soon</div>
    <div class="rule"></div>
    <h1>We’re getting a new website built</h1>
    <p>It’s on its way and won’t be long. Online ordering is paused until it’s ready.</p>
    <p>We’re still open as usual — give us a ring and we’ll sort you out.</p>
    <a class="call" href="tel:{{shopPhoneTel}}">Call {{shopPhone}}</a>
    <div class="where">{{shopFullAddress}}</div>
  </main>
</body>
</html>
