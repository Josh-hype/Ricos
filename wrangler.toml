name = "ricos"
compatibility_date = "2026-05-01"
pages_build_output_dir = "public"

# KV namespaces are bound in the Cloudflare Pages dashboard, NOT here.
# The dashboard bindings are what production reads from.
#
# To create them:
#   1. Cloudflare dashboard → Workers & Pages → KV → Create namespace
#   2. Create FOUR namespaces:  ORDERS_KV, MARKETING_KV, SLOTS_KV, STAFF_LOGIN_KV
#   3. Then in your Pages project: Settings → Functions → KV namespace bindings
#      → Add binding for each, matching the variable name to the namespace.
#
# (Local development only — uncomment and paste real IDs after `wrangler kv
# namespace create ...` if you want `npm run dev` to work locally:
#
# [[kv_namespaces]]
# binding = "ORDERS_KV"
# id = "..."
# )

# Secrets are set in the dashboard: Settings → Variables and Secrets.
# Or via CLI: wrangler pages secret put NAME --project-name=ricos
#
#   STRIPE_SECRET_KEY
#   STRIPE_PUBLISHABLE_KEY
#   STRIPE_WEBHOOK_SECRET
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER
#   STAFF_PIN_HASH        (sha256 of the 4–8 digit PIN, lowercase hex)
#   SESSION_SECRET        (random 32+ char string)
