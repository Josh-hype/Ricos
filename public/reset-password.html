<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — Rico's Peri Peri</title>
<meta name="robots" content="noindex,nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --red: #c8261c;
    --yellow: #f5b71e;
    --cream: #fff5d8;
    --paper: #fffaeb;
    --ink: #181210;
    --grey: #6b5e58;
    --error: #b81f23;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 0 24px 48px -16px rgba(24,18,16,.45);
    padding: 32px 28px;
    max-width: 460px;
    width: 100%;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.6rem;
    margin: 0 0 8px;
    text-align: center;
  }
  p { margin: 10px 0; line-height: 1.5; }
  .muted { color: var(--grey); font-size: 0.92rem; text-align: center; }
  label { display: block; font-weight: 600; font-size: 0.92rem; margin: 16px 0 6px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    font-size: 1rem;
    font-family: inherit;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: var(--ink);
    color: var(--yellow);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: var(--error); font-size: 0.92rem; margin-top: 10px; display: none; }
  .ok-state { text-align: center; padding: 8px 0; }
  .tick {
    width: 56px; height: 56px; border-radius: 50%;
    background: #1f8a3e; color: #fff; margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 30px; line-height: 1;
  }
  .links { margin-top: 18px; text-align: center; }
  a { color: var(--red); }
</style>
</head>
<body>
  <main class="card" id="card">
    <h1>Choose a new password</h1>
    <p class="muted" id="intro">For your Rico's account. The link expires 1 hour after we sent it.</p>

    <form id="resetForm">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" required />

      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" required />

      <button type="submit" id="submitBtn">Save new password</button>
      <div class="error" id="errBox"></div>
    </form>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const card = document.getElementById('card');
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }

  function showSuccess() {
    card.innerHTML = `
      <div class="ok-state">
        <div class="tick" aria-hidden="true">✓</div>
        <h1>Password updated</h1>
        <p>You're signed in. Take me to <a href="/order">place an order</a>.</p>
      </div>`;
  }

  if (!token) {
    showError('No reset token in the URL. Use the link from the email we sent you.');
    submitBtn.disabled = true;
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    if (pw.length < 6) { showError('Password must be at least 6 characters.'); return; }
    if (pw !== pw2)   { showError('Passwords don\'t match.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';
    try {
      const res = await fetch('/api/account/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(body.error || 'Sorry, something went wrong. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save new password';
        return;
      }
      showSuccess();
    } catch {
      showError('Network error — please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save new password';
    }
  });
</script>
</body>
</html>
