<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Orders — Lumin Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B1A2E; --ink-2:#33445C; --muted:#5C6B82; --muted-2:#8090A6;
    --blue:#0070F0; --blue-tint:#E9F2FF;
    --green:#0E9F6E; --green-tint:#E4F6EE;
    --red:#E0464B; --red-tint:#FBECEC;
    --amber:#B7791F; --amber-tint:#FBF1DF;
    --gold:#C2A15B;
    --canvas:#EEF2F7; --panel:#FFFFFF;
    --bd:#C2D0E2; --bd-strong:#A9BCD4; --line:#E4EAF1;
    --sh-sm:0 1px 2px rgba(11,26,46,.06), 0 1px 3px rgba(11,26,46,.05);
    --sh:0 6px 18px rgba(11,26,46,.08), 0 2px 6px rgba(11,26,46,.05);
    --sh-lg:0 24px 60px rgba(11,26,46,.18);
    --sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--canvas);
    -webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;gap:14px;flex:none;
    padding:14px 22px;background:var(--panel);border-bottom:1.5px solid var(--bd);
  }
  .topbar .title{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .topbar .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .topbar .spacer{flex:1}
  /* Lumin Labs brand lockup */
  .brand{display:flex;align-items:center;gap:10px}
  .brand .bm-l{width:24px;height:25px;flex:none}
  .brand .bm-word{font-weight:800;font-size:15px;letter-spacing:.14em;word-spacing:.16em;color:var(--ink);white-space:nowrap}

  /* Filter tabs */
  .filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:none;padding:14px 22px 6px}
  .ftab{
    height:38px;padding:0 16px;border-radius:10px;border:1.5px solid var(--bd);
    background:var(--panel);color:var(--ink-2);font-size:13.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh-sm);transition:.14s;
  }
  .ftab:hover{border-color:var(--blue);color:var(--blue)}
  .ftab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ftab[data-f="notpaid"].active{background:var(--red);border-color:var(--red)}
  .ftab .n{font-family:var(--mono);font-size:11.5px;opacity:.6}
  .ftab.active .n{opacity:.85}

  /* Two-column board */
  .board{
    flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;
    padding:10px 22px 22px;
  }
  .col{
    display:flex;flex-direction:column;min-height:0;
    background:var(--panel);border:1.5px solid var(--bd);border-radius:16px;
    box-shadow:var(--sh-sm);overflow:hidden;
  }
  .col-head{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:14px 16px;border-bottom:1.5px solid var(--bd);background:#FBFCFE;
  }
  .col-head .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .col-live .col-head .dot{background:var(--blue)}
  .col-complete .col-head .dot{background:var(--green)}
  .col-title{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .col-count{
    margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-2);
    background:var(--canvas);border:1.5px solid var(--bd);border-radius:999px;padding:2px 11px;min-width:34px;text-align:center;
  }
  .col-list{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .col-list::-webkit-scrollbar{width:9px}
  .col-list::-webkit-scrollbar-thumb{background:#D4DEEA;border-radius:8px}
  .col-empty{margin:auto;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;padding:40px 12px}

  /* Order row */
  .row{
    display:grid;grid-template-columns:1fr auto auto auto 44px;align-items:center;column-gap:14px;
    background:var(--panel);border:1.5px solid var(--bd);border-left:5px solid var(--muted-2);
    border-radius:12px;padding:13px 14px;position:relative;transition:.14s;
  }
  .row:hover{border-color:var(--bd-strong);box-shadow:var(--sh)}
  .row.paid{border-left-color:var(--green)}
  .row.unpaid{border-left-color:var(--red)}
  .row.menu-open{z-index:20}
  .row .r-ref{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.02em}
  .row .r-amt{font-family:var(--mono);font-size:15px;font-weight:600}
  .row .r-method{font-size:13px;font-weight:700;color:var(--ink-2);min-width:42px;text-align:center}
  .pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:5px 9px;border-radius:7px;white-space:nowrap}
  .pill.paid{background:var(--green-tint);color:var(--green)}
  .pill.unpaid{background:var(--red-tint);color:var(--red)}

  /* Kebab */
  .kebab{position:relative;justify-self:center}
  .kebab .dots{
    width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);
    font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .kebab .dots:hover{background:var(--canvas);color:var(--ink)}
  .kebab .menu{
    position:absolute;top:100%;right:0;margin-top:6px;min-width:180px;z-index:30;
    background:var(--panel);border:1.5px solid var(--bd);border-radius:12px;box-shadow:var(--sh-lg);padding:5px;
  }
  .kebab .menu[hidden]{display:none}
  .kebab .menu button{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;
    padding:12px 13px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink);
  }
  .kebab .menu button:hover{background:var(--canvas)}
  .kebab .menu .mi-complete{color:var(--green)}
  .kebab .menu .mi-complete:hover{background:var(--green-tint)}
  .kebab .menu .mi-paid{color:var(--blue)}
  .kebab .menu .mi-paid:hover{background:var(--blue-tint)}

  @media (max-width:720px){
    .board{grid-template-columns:1fr;overflow-y:auto}
    .col{min-height:300px}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="title">Orders</div>
      <div class="sub">Counter &middot; prototype</div>
    </div>
    <div class="spacer"></div>
    <div class="brand" aria-label="Lumin Labs">
      <svg class="bm-l" viewBox="0 0 40 42" aria-hidden="true">
        <path d="M5 4 H16.5 V31 H38 V40 H5 Z" fill="#0B1A2E"/>
        <rect x="20.5" y="5" width="3.6" height="22" fill="#C2A15B"/>
      </svg>
      <span class="bm-word">LUMIN LABS</span>
    </div>
  </header>

  <div class="filters" id="filters">
    <button class="ftab active" data-f="all" type="button">All <span class="n" data-n="all">0</span></button>
    <button class="ftab" data-f="notpaid" type="button">Not paid <span class="n" data-n="notpaid">0</span></button>
    <button class="ftab" data-f="card" type="button">Card <span class="n" data-n="card">0</span></button>
    <button class="ftab" data-f="cash" type="button">Cash <span class="n" data-n="cash">0</span></button>
  </div>

  <main class="board">
    <section class="col col-live" id="colLive">
      <div class="col-head"><span class="dot"></span><span class="col-title">Live</span><span class="col-count" id="liveCount">0</span></div>
      <div class="col-list" id="liveList"></div>
    </section>
    <section class="col col-complete" id="colComplete">
      <div class="col-head"><span class="dot"></span><span class="col-title">Complete</span><span class="col-count" id="completeCount">0</span></div>
      <div class="col-list" id="completeList"></div>
    </section>
  </main>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---- State (plain JS variables — no storage) ---------------------------- */
// method: 'card' | 'cash' | null ('—').  col: 'live' | 'complete'.
let orders = [
  { id: '502', amountP: 1220, method: 'card', paid: true,  col: 'live' },
  { id: '307', amountP: 1000, method: 'cash', paid: true,  col: 'live' },
  { id: '705', amountP: 2000, method: 'card', paid: true,  col: 'live' },
  { id: '500', amountP: 3000, method: null,   paid: false, col: 'live' },
];
let filter = 'all'; // all | notpaid | card | cash

/* ---- Helpers ------------------------------------------------------------ */
const money = p => '£' + (p / 100).toFixed(2);
const methodLabel = m => m === 'card' ? 'Card' : (m === 'cash' ? 'Cash' : '—');

function matchesFilter(o) {
  if (filter === 'notpaid') return !o.paid;
  if (filter === 'card') return o.method === 'card';
  if (filter === 'cash') return o.method === 'cash';
  return true; // all
}

/* ---- Render ------------------------------------------------------------- */
function rowHtml(o) {
  const cls = ['row', o.paid ? 'paid' : 'unpaid'];
  // Contextual kebab actions: complete (live only) + mark paid (unpaid only).
  const items = [];
  if (o.col === 'live') items.push('<button class="mi-complete" data-act="complete" data-id="' + o.id + '">✓ Mark complete</button>');
  if (!o.paid) items.push('<button class="mi-paid" data-act="paid" data-id="' + o.id + '">💳 Mark paid</button>');
  const kebab = items.length
    ? '<div class="kebab"><button class="dots" data-id="' + o.id + '" aria-label="Actions">⋯</button>'
      + '<div class="menu" hidden>' + items.join('') + '</div></div>'
    : '<span></span>';
  return ''
    + '<article class="' + cls.join(' ') + '" data-id="' + o.id + '">'
    +   '<span class="r-ref">#' + o.id + '</span>'
    +   '<span class="r-amt">' + money(o.amountP) + '</span>'
    +   '<span class="r-method">' + methodLabel(o.method) + '</span>'
    +   '<span class="pill ' + (o.paid ? 'paid' : 'unpaid') + '">' + (o.paid ? 'Paid' : 'Not paid') + '</span>'
    +   kebab
    + '</article>';
}

function render() {
  const live = orders.filter(o => o.col === 'live' && matchesFilter(o));
  const done = orders.filter(o => o.col === 'complete' && matchesFilter(o));

  $('#liveList').innerHTML = live.length
    ? live.map(rowHtml).join('')
    : '<div class="col-empty">No live orders match this filter.</div>';
  $('#completeList').innerHTML = done.length
    ? done.map(rowHtml).join('')
    : '<div class="col-empty">Nothing here yet.</div>';

  $('#liveCount').textContent = live.length;
  $('#completeCount').textContent = done.length;

  // Filter-tab counts (independent of the active filter — always the totals).
  const f = (test) => orders.filter(test).length;
  $('[data-n="all"]').textContent = orders.length;
  $('[data-n="notpaid"]').textContent = f(o => !o.paid);
  $('[data-n="card"]').textContent = f(o => o.method === 'card');
  $('[data-n="cash"]').textContent = f(o => o.method === 'cash');

  wireRows();
}

/* ---- Interactivity ------------------------------------------------------ */
function wireRows() {
  // Kebab open/close (one open at a time).
  $$('.kebab .dots').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const menu = b.parentElement.querySelector('.menu');
    const willOpen = menu.hasAttribute('hidden');
    closeMenus();
    if (willOpen) {
      menu.removeAttribute('hidden');
      b.closest('.row').classList.add('menu-open');
    }
  }));
  // Actions.
  $$('.kebab .menu button').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const o = orders.find(x => x.id === b.dataset.id);
    if (!o) return;
    if (b.dataset.act === 'complete') o.col = 'complete';   // LIVE → COMPLETE
    if (b.dataset.act === 'paid') o.paid = true;            // Not paid → Paid
    closeMenus();
    render();
  }));
}
function closeMenus() {
  $$('.kebab .menu').forEach(m => m.setAttribute('hidden', ''));
  $$('.row.menu-open').forEach(r => r.classList.remove('menu-open'));
}
document.addEventListener('click', e => { if (!e.target.closest('.kebab')) closeMenus(); });

// Filter tabs (one active at a time → filters the visible orders).
$$('#filters .ftab').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  $$('#filters .ftab').forEach(x => x.classList.toggle('active', x === b));
  render();
}));

render();
</script>
</body>
</html>
